name: mecord-r5-certification

x-relay: &relay
  build:
    context: ../../..
    dockerfile: certification/r5/deployment/Dockerfile.relay
    network: host
    args:
      OPERATOR_SOURCE_COMMIT: ${OPERATOR_SOURCE_COMMIT:?set by campaign-control}
  image: mecord-r5-relay:${OPERATOR_SOURCE_COMMIT:?set by campaign-control}
  init: true
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &relay-environment
    OPERATOR_CONTROL_PLANE_HOST: postgres
    OPERATOR_CONTROL_PLANE_PORT: "5432"
    OPERATOR_CONTROL_PLANE_DATABASE: mecord
    OPERATOR_CONTROL_PLANE_USER: mecord
    OPERATOR_CONTROL_PLANE_PASSWORD_FILE: /run/secrets/postgres_password
    OPERATOR_RELAY_CLUSTER_LEASE_MS: "30000"
    OPERATOR_RELAY_STATE_DIR: /var/lib/operator-relay
    OPERATOR_RELAY_HOST: 0.0.0.0
    OPERATOR_RELAY_RESULT_HOST: 0.0.0.0
    OPERATOR_RELAY_PUBLIC_BIND_ACK: TLS_TERMINATES_UPSTREAM
  secrets:
    - postgres_password
  networks:
    - certification
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: 20m, max-file: "5"}

services:
  postgres:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    restart: unless-stopped
    environment:
      POSTGRES_DB: mecord
      POSTGRES_USER: mecord
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - evidence:/evidence
    networks:
      - certification
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mecord -d mecord"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 256m
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}

  relay-a:
    <<: *relay
    environment:
      <<: *relay-environment
      OPERATOR_RELAY_INSTANCE_ID: relay-a
    volumes:
      - relay_a_state:/var/lib/operator-relay

  relay-b:
    <<: *relay
    environment:
      <<: *relay-environment
      OPERATOR_RELAY_INSTANCE_ID: relay-b
    volumes:
      - relay_b_state:/var/lib/operator-relay

  monitor:
    image: node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
    init: true
    restart: unless-stopped
    depends_on:
      relay-a: {condition: service_healthy}
      relay-b: {condition: service_healthy}
    command: [node, /monitor/monitor.mjs]
    environment:
      CAMPAIGN_ID: ${R5_CAMPAIGN_ID:?set by campaign-control}
      SOURCE_SHA: ${OPERATOR_SOURCE_COMMIT:?set by campaign-control}
      MONITOR_INTERVAL_MS: "30000"
    volumes:
      - ./monitor.mjs:/monitor/monitor.mjs:ro
      - evidence:/evidence
    networks:
      - certification
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64

secrets:
  postgres_password:
    file: ./state/postgres_password

networks:
  certification:
    internal: true

volumes:
  postgres_data:
  relay_a_state:
  relay_b_state:
  evidence:
