name: R4 Human-Centered Product

on:
  push:
    branches: ['main', 'program/r4-**']
    paths:
      - 'apps/local-agent/control-center/**'
      - 'apps/local-agent/src/control-center.ts'
      - 'apps/local-agent/src/server.ts'
      - 'src/core/control-center-*.ts'
      - 'test/control-center-ux.test.ts'
      - 'test/control-center-evolution.test.ts'
      - 'test/r4-human-product.test.ts'
      - 'test/runtime-projection.test.ts'
      - 'test/companion-api.test.ts'
      - 'packages/mecord-connect/scripts/build-runtime-payload.mjs'
      - 'test/windows-store-release-config.test.ts'
      - 'packaging/windows/build-release.ps1'
      - '.github/workflows/r4-human-product.yml'
  pull_request:
    paths:
      - 'apps/local-agent/control-center/**'
      - 'apps/local-agent/src/control-center.ts'
      - 'apps/local-agent/src/server.ts'
      - 'src/core/control-center-*.ts'
      - 'test/control-center-ux.test.ts'
      - 'test/control-center-evolution.test.ts'
      - 'test/r4-human-product.test.ts'
      - 'test/runtime-projection.test.ts'
      - 'test/companion-api.test.ts'
      - 'packages/mecord-connect/scripts/build-runtime-payload.mjs'
      - 'test/windows-store-release-config.test.ts'
      - 'packaging/windows/build-release.ps1'
      - '.github/workflows/r4-human-product.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r4-human-product-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  r4:
    name: R4 product contracts and local E2E
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Build Windows native path-lease helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./native/windows-path-lease/build.ps1
          $pathLease = (Resolve-Path native/windows-path-lease/target/release/operator-windows-path-lease.exe).Path
          "OPERATOR_WINDOWS_PATH_LEASE_PATH=$pathLease" >> $env:GITHUB_ENV
      - run: npm run test:r4
      - name: Install pinned TypeScript toolchain
        run: npm --prefix apps/mcp-server ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck:production
