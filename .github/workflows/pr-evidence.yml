name: PR Evidence Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  source-evidence:
    name: Source, risk, tests and physical-status declaration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Check PR evidence validator contract
        run: node --experimental-strip-types --test test/pr-evidence-gate.test.ts
      - name: Fail closed for new PRs missing exact source/evidence fields
        run: node scripts/verify-pr-evidence.mjs
