name: One-shot dependency remediation

on:
  push:
    branches:
      - program/r5-dependency-security

permissions:
  contents: write

jobs:
  remediate:
    if: "!contains(github.event.head_commit.message, 'chore(security): regenerate audited node locks')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: false

      - name: Regenerate dependency locks with npm advisory data
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/mcp-server audit fix --package-lock-only --ignore-scripts --no-fund
          npm --prefix apps/relay-server audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Verify clean installs
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/mcp-server ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/relay-server ci --ignore-scripts --no-audit --no-fund

      - name: Verify security gates
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/mcp-server audit --omit=dev --audit-level=high
          npm --prefix apps/relay-server audit --omit=dev --audit-level=high
          npm --prefix apps/mcp-server audit --audit-level=critical
          npm --prefix apps/relay-server audit --audit-level=critical

      - name: Commit verified lock remediation and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mecord-roadmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mcp-server/package.json apps/mcp-server/package-lock.json apps/relay-server/package.json apps/relay-server/package-lock.json
          git rm .github/workflows/roadmap-dependency-remediation.yml
          git diff --cached --check
          git commit -m "chore(security): regenerate audited node locks"
          git push origin HEAD:program/r5-dependency-security
