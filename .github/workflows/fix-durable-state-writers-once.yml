name: Fix durable state writers once

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fix generated writers and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for filename, typename in [('src/core/device-registry.ts', 'RegistryState'), ('src/core/session-token.ts', 'SessionState')]:
              p = Path(filename)
              s = p.read_text()
              old = f'  async #write(state: {typename}): Promise<void> {{\n    const state = validateState(state);'
              new = f'  async #write(stateInput: {typename}): Promise<void> {{\n    const state = validateState(stateInput);'
              if s.count(old) != 1:
                  raise SystemExit(f'{filename}: writer anchor mismatch {s.count(old)}')
              p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-durable-state-writers-once.yml
          git config user.name 'Operator CI'
          git config user.email 'operator-ci@example.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: repair generated durable state writers'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
