name: C05 Reviewed Model Goal Boundary

on:
  pull_request:
    paths:
      - 'src/core/reviewed-model-goal.ts'
      - 'test/reviewed-model-goal.test.ts'
      - 'src/core/task-proposal-review.ts'
      - 'src/core/model-goal-proposal.ts'
      - '.github/workflows/c05-reviewed-model-goal.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/reviewed-model-goal.ts'
      - 'test/reviewed-model-goal.test.ts'
      - 'src/core/task-proposal-review.ts'
      - 'src/core/model-goal-proposal.ts'
      - '.github/workflows/c05-reviewed-model-goal.yml'

permissions:
  contents: read

jobs:
  reviewed-goal-no-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --experimental-strip-types --test test/model-goal-proposal.test.ts test/task-proposal-review.test.ts test/reviewed-model-goal.test.ts
