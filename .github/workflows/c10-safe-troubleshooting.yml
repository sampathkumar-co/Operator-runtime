name: C10 Safe Control Center Troubleshooting

on:
  pull_request:
    paths:
      - 'apps/control-center/src/**'
      - 'apps/local-agent/src/control-center.ts'
      - 'test/control-center-troubleshooting.test.ts'
      - '.github/workflows/c10-safe-troubleshooting.yml'
  push:
    branches: [main]
    paths:
      - 'apps/control-center/src/**'
      - 'apps/local-agent/src/control-center.ts'
      - 'test/control-center-troubleshooting.test.ts'
      - '.github/workflows/c10-safe-troubleshooting.yml'

permissions:
  contents: read

jobs:
  user-help-without-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify safe troubleshooting and exact generated UI parity
        run: node --experimental-strip-types --test test/control-center-troubleshooting.test.ts test/control-center-browser-login.test.ts
      - name: Reproduce generated Control Center and fail on unstaged differences
        run: |
          node apps/control-center/scripts/build.mjs
          git diff --exit-code -- apps/local-agent/src/control-center.ts
