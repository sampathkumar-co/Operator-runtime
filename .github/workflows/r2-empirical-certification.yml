name: R2 Empirical Certification

on:
  workflow_dispatch:
  push:
    branches: ['program/r1-r3-closeout-20261006']
    paths:
      - 'scripts/run-r2-historical-replay.ts'
      - 'scripts/verify-r2-empirical-certification.ts'
      - '.github/workflows/r2-empirical-certification.yml'

permissions:
  contents: write

concurrency:
  group: r2-empirical-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-replay:
    name: R2 1000-task historical replay
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Assert public-repository zero-paid-service campaign
        shell: bash
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "$REPO_VISIBILITY" = "public"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
      - name: Run frozen non-benchmark historical cohort
        run: node --experimental-strip-types scripts/run-r2-historical-replay.ts
      - name: Independently verify promotion artifacts
        run: node --experimental-strip-types scripts/verify-r2-empirical-certification.ts
      - name: Persist certification evidence in Git
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="evidence/r2/${GITHUB_SHA}"
          mkdir -p "$EVIDENCE_DIR"
          cp artifacts/r2-empirical/certification.json "$EVIDENCE_DIR/"
          cp artifacts/r2-empirical/general-promotion-evidence.json "$EVIDENCE_DIR/"
          cp artifacts/r2-empirical/promotion-state.json "$EVIDENCE_DIR/"
          cp artifacts/r2-empirical/promotion-bundle.json "$EVIDENCE_DIR/"
          tar -C artifacts/r2-empirical -czf "$EVIDENCE_DIR/raw-evidence.tar.gz" cohort-manifest.json task-results.jsonl decision-traces.jsonl decision-outcomes.jsonl sha256sums.txt
          (
            cd "$EVIDENCE_DIR"
            sha256sum certification.json general-promotion-evidence.json promotion-state.json promotion-bundle.json raw-evidence.tar.gz > persisted-sha256sums.txt
          )
          {
            echo "## R2 empirical certification"
            echo
            cat "$EVIDENCE_DIR/certification.json"
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVIDENCE_DIR"
          git commit -m "evidence(r2): persist empirical certification ${GITHUB_SHA}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
