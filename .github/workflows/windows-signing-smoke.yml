name: Windows Signing Smoke

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  sign-install-smoke:
    name: Ephemeral MSIX sign/install smoke
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup default 1.98.0
          rustc --version
          cargo --version
      - name: Create ephemeral CI code-signing certificate
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/signing | Out-Null
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=Operator CI Test' `
            -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy NonExportable `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}') `
            -FriendlyName 'Operator CI Ephemeral Signing'
          Export-Certificate -Cert $cert -FilePath artifacts/signing/operator-ci.cer | Out-Null
          Import-Certificate -FilePath artifacts/signing/operator-ci.cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "publisher=$($cert.Subject)" >> $env:GITHUB_OUTPUT
          $fingerprintSha256 = $cert.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
          "fingerprint_sha256=$fingerprintSha256" >> $env:GITHUB_OUTPUT
      - name: Build package with matching publisher
        shell: pwsh
        run: |
          ./packaging/windows/build-release.ps1 `
            -Version 0.1.0.0 `
            -Publisher '${{ steps.cert.outputs.publisher }}' `
            -UpdateBaseUri https://updates.example.invalid/operator `
            -OutputDir artifacts/windows-signing-smoke
      - name: Sign and verify package
        shell: pwsh
        run: |
          ./packaging/windows/sign-release.ps1 `
            -MsixPath artifacts/windows-signing-smoke/Operator-0.1.0.0-x64.msix `
            -Provider CertificateStore `
            -CertificateThumbprint '${{ steps.cert.outputs.thumbprint }}' `
            -CertificateStoreScope CurrentUser `
            -SkipTimestampForTest `
            -MetadataPath artifacts/windows-signing-smoke/release-metadata.json
          ./packaging/windows/sign-release.ps1 `
            -MsixPath artifacts/windows-signing-smoke/Operator-0.1.0.0-x64.msix `
            -Provider VerifyOnly `
            -SkipTimestampForTest `
            -MetadataPath artifacts/windows-signing-smoke/release-metadata.json
          $meta = Get-Content artifacts/windows-signing-smoke/release-metadata.json -Raw | ConvertFrom-Json
          if ($meta.signed -ne $true) { throw 'signed release metadata was not updated' }
          if ($meta.signerSubject -ne '${{ steps.cert.outputs.publisher }}') { throw 'signer subject metadata mismatch' }
          if ($meta.signerCertificateSha256 -ne '${{ steps.cert.outputs.fingerprint_sha256 }}') { throw 'signer certificate fingerprint metadata mismatch' }
          if ($meta.timestamped -ne $false) { throw 'ephemeral CI signing must be recorded as non-timestamped' }
      - name: Install through npx bootstrap core and verify one-command readiness
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = (Resolve-Path artifacts/windows-signing-smoke/Operator-0.1.0.0-x64.msix).Path
          $meta = (Resolve-Path artifacts/windows-signing-smoke/release-metadata.json).Path
          $root = Join-Path $env:RUNNER_TEMP 'operator-installed-authorized-root'
          $bootstrapLog = Join-Path $env:RUNNER_TEMP 'operator-bootstrap-smoke.log'

          function Write-BootstrapShellPhase([string]$Phase) {
            $line = "[operator-bootstrap-shell-phase] $Phase"
            Write-Host $line
            Add-Content -LiteralPath $bootstrapLog -Value $line
          }

          $smokeSucceeded = $false
          try {
            Write-BootstrapShellPhase 'node-smoke:start'
            & node packages/operator-runtime-cli/scripts/ci-bootstrap-smoke.mjs $meta $msix '${{ steps.cert.outputs.publisher }}' '${{ steps.cert.outputs.fingerprint_sha256 }}' $root
            $bootstrapExit = $LASTEXITCODE
            if ($bootstrapExit -ne 0) { throw "npx bootstrap core smoke failed with exit code $bootstrapExit" }
            Write-BootstrapShellPhase 'node-smoke:ok'

            Write-BootstrapShellPhase 'package-query:start'
            $package = Get-AppxPackage -Name 'Operator.Runtime' | Select-Object -First 1
            if (-not $package) { throw 'Operator.Runtime package was not registered' }
            Write-BootstrapShellPhase 'package-query:ok'

            Write-BootstrapShellPhase 'launcher-self-test:start'
            $launcher = Join-Path $package.InstallLocation 'Operator.exe'
            $output = & $launcher --self-test
            if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch 'operator-launcher-self-test:ok') { throw 'packaged launcher self-test failed' }
            Write-BootstrapShellPhase 'launcher-self-test:ok'

            Write-BootstrapShellPhase 'health-agent:start'
            $agent = Invoke-RestMethod -Uri 'http://127.0.0.1:47100/health' -TimeoutSec 2
            if (-not $agent.ok -or $agent.service -ne 'operator-local-agent') { throw 'installed local agent health check failed' }
            Write-BootstrapShellPhase 'health-agent:ok'

            Write-BootstrapShellPhase 'health-mcp:start'
            $mcp = Invoke-RestMethod -Uri 'http://127.0.0.1:47200/health' -TimeoutSec 2
            if (-not $mcp.ok -or $mcp.service -ne 'operator-mcp-server') { throw 'installed MCP health check failed' }
            Write-BootstrapShellPhase 'health-mcp:ok'
            $smokeSucceeded = $true
          } finally {
            $operatorState = Join-Path $env:LOCALAPPDATA 'Operator'
            try {
              if ($smokeSucceeded) {
                Write-BootstrapShellPhase 'public-uninstall:start'
                if (-not (Test-Path -LiteralPath $operatorState -PathType Container)) { throw 'Operator state directory is missing before uninstall smoke.' }
                $bundledNode = Join-Path $package.InstallLocation 'runtime\node.exe'
                $runningBefore = @(Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $bundledNode })
                if ($runningBefore.Count -lt 1) { throw 'Packaged Operator runtime was not running before uninstall smoke.' }
                & node packages/operator-runtime-cli/bin/operator-runtime-cli.mjs uninstall
                if ($LASTEXITCODE -ne 0) { throw "public uninstall command failed with exit code $LASTEXITCODE" }
                if (Get-AppxPackage -Name 'Operator.Runtime') { throw 'Operator.Runtime remained installed after public uninstall command.' }
                if (Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $bundledNode }) { throw 'Packaged Operator runtime remained running after public uninstall command.' }
                if (-not (Test-Path -LiteralPath $operatorState -PathType Container)) { throw 'Public uninstall unexpectedly removed local Operator state.' }
                Write-BootstrapShellPhase 'public-uninstall:ok'
              } else {
                Write-BootstrapShellPhase 'cleanup-stop-runtime:start'
                if ($package) {
                  $bundledNode = Join-Path $package.InstallLocation 'runtime\node.exe'
                  Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $bundledNode } | Stop-Process -Force -ErrorAction SilentlyContinue
                }
                Get-AppxPackage -Name 'Operator.Runtime' | Remove-AppxPackage -ErrorAction SilentlyContinue
                Write-BootstrapShellPhase 'cleanup-stop-runtime:ok'
              }
            } finally {
              Write-BootstrapShellPhase 'cleanup-state:start'
              Remove-Item -LiteralPath $operatorState -Recurse -Force -ErrorAction SilentlyContinue
              Write-BootstrapShellPhase 'cleanup-state:ok'
            }
          }
          Write-BootstrapShellPhase 'step:ok'
      - name: Upload bootstrap diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-bootstrap-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operator-bootstrap-smoke.log
          if-no-files-found: warn
          retention-days: 3
      - name: Remove ephemeral trust material
        if: always()
        shell: pwsh
        run: |
          $thumb = '${{ steps.cert.outputs.thumbprint }}'
          if ($thumb) {
            Remove-Item "Cert:\CurrentUser\My\$thumb" -Force -ErrorAction SilentlyContinue
            Get-ChildItem 'Cert:\LocalMachine\TrustedPeople' | Where-Object Thumbprint -eq $thumb | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          Remove-Item artifacts/signing -Recurse -Force -ErrorAction SilentlyContinue
