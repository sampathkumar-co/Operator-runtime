name: C02 Truthful Runtime Capability Discovery

on:
  pull_request:
    paths:
      - 'src/core/capability-discovery.ts'
      - 'src/core/runtime.ts'
      - 'test/capability-discovery-truth.test.ts'
      - '.github/workflows/c02-capability-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/capability-discovery.ts'
      - 'src/core/runtime.ts'
      - 'test/capability-discovery-truth.test.ts'
      - '.github/workflows/c02-capability-discovery.yml'

permissions:
  contents: read

jobs:
  read-only-capability-declarations:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Reject permission discovery, unverifiable provider success and missing scope
        run: node --experimental-strip-types --test test/capability-discovery-truth.test.ts
