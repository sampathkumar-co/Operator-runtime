name: Mecord Isolated NPM Test Candidate

# An installable local tarball for owner-approved testing, not npm publication.
# Kept separate from every stable/RC publish and signed-release workflow.
on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 'Isolated test archive version (2.0.7-rc.N, not published)'
        required: true
        default: '2.0.7-rc.1'
        type: string

permissions:
  contents: read

concurrency:
  group: mecord-test-only-${{ github.sha }}-${{ inputs.candidate_version }}
  cancel-in-progress: false

jobs:
  isolated-windows-candidate:
    if: github.repository == 'sampathkumar-co/Operator-runtime' && github.ref == 'refs/heads/main'
    name: Build and locally install test-only Windows npm tarball
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      MECORD_TEST_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      OPERATOR_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Assert exact checkout and strictly test-only RC request
        id: identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          "sha=$sha" >> $env:GITHUB_OUTPUT
          $env:OPERATOR_CHECKOUT_SHA = $sha
          node scripts/npm-test-candidate-policy.mjs
          if ($LASTEXITCODE -ne 0) { throw 'test candidate source policy rejected request' }
          node --experimental-strip-types --test test/npm-test-candidate-policy.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'test candidate policy regression tests failed' }

      - name: Compile source-matched native Windows helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup default 1.98.1
          rustup component add clippy --toolchain 1.98.1
          cargo clippy --locked --manifest-path native/windows-dpapi/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI clippy failed' }
          cargo clippy --locked --manifest-path native/windows-uia/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'UIA clippy failed' }
          cargo build --locked --manifest-path native/windows-dpapi/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI build failed' }
          cargo build --locked --manifest-path native/windows-uia/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'UIA build failed' }
          ./native/windows-path-lease/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'path-lease helper build failed' }
          & ./native/windows-dpapi/target/release/operator-windows-dpapi.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI self-test failed' }
          & ./native/windows-path-lease/target/release/operator-windows-path-lease.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'path-lease self-test failed' }

      - name: Set isolated RC metadata and compile runtime from HEAD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'packages/mecord-connect/package.json'
          $pkg = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          if ($pkg.name -ne 'mecord-connect' -or $pkg.version -ne '2.0.6') {
            throw 'unexpected stable package identity; review before building a test candidate'
          }
          $pkg.version = $env:MECORD_TEST_CANDIDATE_VERSION
          $pkg | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $file -Encoding utf8
          node packages/mecord-connect/scripts/build-runtime-payload.mjs
          if ($LASTEXITCODE -ne 0) { throw 'runtime payload build failed' }
          node packages/mecord-connect/src/publish-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'source and RC metadata binding failed' }
          node --experimental-strip-types --test test/npm-remote-runtime.test.ts test/npm-policy-continuity.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'npm runtime/security tests failed' }
          node packages/mecord-connect/bin/operator.mjs doctor
          if ($LASTEXITCODE -ne 0) { throw 'test candidate doctor failed' }

      - name: Pack and independently install candidate in disposable directory
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'npm-test-candidate'
          $smoke = Join-Path $env:RUNNER_TEMP 'isolated-npm-test-install'
          New-Item -ItemType Directory -Force -Path $artifact, $smoke | Out-Null
          $result = npm pack --json ./packages/mecord-connect --pack-destination $artifact | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $result.Count -ne 1) { throw 'npm test pack failed' }
          if ($result[0].name -ne 'mecord-connect' -or $result[0].version -ne $env:MECORD_TEST_CANDIDATE_VERSION) {
            throw 'unexpected npm test artifact identity'
          }
          $files = @($result[0].files | ForEach-Object { $_.path })
          foreach ($required in @('LICENSE', 'DISCLOSURE', 'runtime/runtime-manifest.json',
            'runtime/native/operator-windows-dpapi.exe', 'runtime/native/operator-windows-uia.exe',
            'runtime/native/operator-windows-path-lease.exe', 'runtime/app/apps/local-agent/src/remote.js')) {
            if ($required -notin $files) { throw "test tarball missing $required" }
          }
          $manifest = Get-Content 'packages/mecord-connect/runtime/runtime-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:MECORD_TEST_CANDIDATE_VERSION -or
              $manifest.sourceCommit -ne $env:GITHUB_SHA) { throw 'test tarball manifest source/version mismatch' }
          $tarball = Join-Path $artifact $result[0].filename
          $sha256 = (Get-FileHash -LiteralPath $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$tarball.sha256" -Value "$sha256  $($result[0].filename)" -NoNewline -Encoding ascii
          npm install --prefix $smoke --ignore-scripts --no-audit --no-fund $tarball
          if ($LASTEXITCODE -ne 0) { throw 'isolated test package installation failed' }
          $installed = Join-Path $smoke 'node_modules/mecord-connect'
          node (Join-Path $installed 'bin/operator.mjs') doctor
          if ($LASTEXITCODE -ne 0) { throw 'isolated installed doctor failed' }
          $shim = Join-Path $smoke 'node_modules/.bin/mecord-connect.cmd'
          if (-not (Test-Path -LiteralPath $shim -PathType Leaf)) { throw 'test package command shim missing' }
          & $shim doctor
          if ($LASTEXITCODE -ne 0) { throw 'installed test package command shim doctor failed' }
          $metadata = [ordered]@{
            schemaVersion = 1
            package = 'mecord-connect'
            version = $env:MECORD_TEST_CANDIDATE_VERSION
            sourceCommit = $env:GITHUB_SHA
            tarball = $result[0].filename
            sha256 = $sha256
            workflowRunId = $env:GITHUB_RUN_ID
            status = 'ISOLATED_TEST_ARTIFACT_ONLY'
            npmRegistryPublished = $false
            physicalDeviceVerified = $false
            releaseAccepted = $false
          }
          $metadata | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $artifact 'test-candidate.json') -Encoding utf8
          "## Non-publishing Mecord test candidate" >> $env:GITHUB_STEP_SUMMARY
          "Source SHA: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Version: $env:MECORD_TEST_CANDIDATE_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "Tarball SHA256: $sha256" >> $env:GITHUB_STEP_SUMMARY
          "Only disposable local installation + doctor tested. No device/VPS test, no npm registry publication." >> $env:GITHUB_STEP_SUMMARY

      - name: Save installable archive and source-bound checksum (no publish)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mecord-test-only-${{ inputs.candidate_version }}-${{ github.sha }}
          path: npm-test-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
