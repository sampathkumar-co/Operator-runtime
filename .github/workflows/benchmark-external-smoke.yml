name: Benchmark External Smoke

on:
  push:
    branches:
      - benchmark/stage21-baseline
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-external-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-external-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsergym-miniwob-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install BrowserGym MiniWoB
        run: |
          python -m pip install --upgrade pip
          python -m pip install "browsergym-miniwob==0.14.3"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Pin MiniWoB++ benchmark assets
        run: |
          git clone https://github.com/Farama-Foundation/miniwob-plusplus.git miniwob-plusplus
          git -C miniwob-plusplus reset --hard 7fd85d71a4b60325c6585396ec4f48377d049838
          echo "MINIWOB_URL=file://${GITHUB_WORKSPACE}/miniwob-plusplus/miniwob/html/miniwob/" >> "$GITHUB_ENV"

      - name: Reset official MiniWoB task
        run: python benchmark/smoke/browsergym_miniwob.py

      - name: Exercise official MiniWoB reward path
        run: python benchmark/smoke/browsergym_reward_selftest.py

      - name: Exercise MiniWoB through Mecord browser provider
        run: python benchmark/smoke/miniwob_mecord_toolpath.py
