name: Windows Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Four-part MSIX version, for example 0.1.0.0
        required: true
        type: string
      update_base_uri:
        description: Final credential-free HTTPS directory that will host the MSIX and Operator.appinstaller
        required: true
        type: string
      timestamp_uri:
        description: HTTPS RFC 3161 timestamp server
        required: true
        type: string
      identity_name:
        description: Stable MSIX package identity name
        required: true
        default: Operator.Runtime
        type: string
      publish_github_release:
        description: Publish immutable signed assets as the latest GitHub Release after verification
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: operator-windows-production-release
  cancel-in-progress: false

jobs:
  build-sign-verify:
    if: github.ref == 'refs/heads/main'
    name: Build, timestamp-sign and verify Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PFX_BASE64: ${{ secrets.OPERATOR_WINDOWS_SIGNING_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.OPERATOR_WINDOWS_SIGNING_PFX_PASSWORD }}
      RELEASE_VERSION: ${{ inputs.version }}
      UPDATE_BASE_URI: ${{ inputs.update_base_uri }}
      TIMESTAMP_URI: ${{ inputs.timestamp_uri }}
      IDENTITY_NAME: ${{ inputs.identity_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'

      - name: Require PR-certified green main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-source.mjs

      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup default 1.98.0
          rustup component add clippy --toolchain 1.98.0
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Validate release inputs and materialize signing certificate
        id: certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/production-release-inputs.mjs
          if ($LASTEXITCODE -ne 0) { throw 'production release input validation failed' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'version must be a four-part MSIX version' }
          if ($env:IDENTITY_NAME -ne 'Operator.Runtime') { throw 'identity_name must remain Operator.Runtime for the public bootstrap.' }
          foreach ($pair in @(@('update_base_uri', $env:UPDATE_BASE_URI), @('timestamp_uri', $env:TIMESTAMP_URI))) {
            $uri = [Uri]$pair[1]
            if (-not $uri.IsAbsoluteUri -or $uri.Scheme -ne 'https' -or $uri.UserInfo) { throw "$($pair[0]) must be a credential-free absolute HTTPS URI" }
          }
          if (-not $env:PFX_BASE64) { throw 'OPERATOR_WINDOWS_SIGNING_PFX_BASE64 secret is required' }
          if (-not $env:PFX_PASSWORD) { throw 'OPERATOR_WINDOWS_SIGNING_PFX_PASSWORD secret is required' }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'operator-production-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, $env:PFX_PASSWORD, $flags)
          try {
            if (-not $cert.HasPrivateKey) { throw 'Signing certificate does not contain a private key' }
            if (-not $cert.Subject) { throw 'Signing certificate has no subject' }
            $now = [DateTime]::UtcNow
            if ($cert.NotBefore.ToUniversalTime() -gt $now) { throw 'Signing certificate is not yet valid' }
            if ($cert.NotAfter.ToUniversalTime() -le $now) { throw 'Signing certificate is expired' }
            $ekuExtension = $cert.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' } | Select-Object -First 1
            if (-not $ekuExtension) { throw 'Signing certificate does not declare Enhanced Key Usage' }
            $eku = [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]$ekuExtension
            $codeSigning = @($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' })
            if ($codeSigning.Count -ne 1) { throw 'Signing certificate is not valid for Code Signing EKU' }
            "publisher=$($cert.Subject)" >> $env:GITHUB_OUTPUT
            "fingerprint_sha256=$($cert.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
            Write-Host "[operator-release] certificate subject $($cert.Subject)"
            Write-Host "[operator-release] certificate expires $($cert.NotAfter.ToUniversalTime().ToString('o'))"
          } finally { $cert.Dispose() }

      - name: Clippy release launcher
        shell: pwsh
        run: cargo clippy --locked --manifest-path native/windows-launcher/Cargo.toml --all-targets -- -D warnings

      - name: Build package with certificate-matching publisher
        shell: pwsh
        run: |
          ./packaging/windows/build-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -Publisher '${{ steps.certificate.outputs.publisher }}' `
            -IdentityName $env:IDENTITY_NAME `
            -UpdateBaseUri $env:UPDATE_BASE_URI

      - name: Timestamp-sign and verify package
        shell: pwsh
        run: |
          $msix = "artifacts/windows-release/Operator-$env:RELEASE_VERSION-x64.msix"
          ./packaging/windows/sign-release.ps1 `
            -MsixPath $msix `
            -PfxPath '${{ steps.certificate.outputs.pfx_path }}' `
            -PfxPassword $env:PFX_PASSWORD `
            -TimestampUri $env:TIMESTAMP_URI

      - name: Verify final release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Resolve-Path "artifacts/windows-release/Operator-$env:RELEASE_VERSION-x64.msix"
          $meta = Get-Content artifacts/windows-release/release-metadata.json -Raw | ConvertFrom-Json
          if ($meta.signed -ne $true) { throw 'final package metadata is not marked signed' }
          if ($meta.timestamped -ne $true) { throw 'production release must be timestamped' }
          if ($meta.signerSubject -ne '${{ steps.certificate.outputs.publisher }}') { throw 'metadata signer subject mismatch' }
          if ($meta.signerCertificateSha256 -ne '${{ steps.certificate.outputs.fingerprint_sha256 }}') { throw 'metadata signer fingerprint mismatch' }
          if ($meta.publisher -ne '${{ steps.certificate.outputs.publisher }}') { throw 'metadata publisher mismatch' }
          if ($meta.sha256 -ne (Get-FileHash $msix -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'signed MSIX SHA-256 mismatch' }
          [xml]$installer = Get-Content artifacts/windows-release/Operator.appinstaller -Raw
          if ($installer.AppInstaller.MainPackage.Publisher -ne '${{ steps.certificate.outputs.publisher }}') { throw 'App Installer publisher mismatch' }
          if ($installer.AppInstaller.MainPackage.Uri -notmatch '^https://') { throw 'App Installer package URI must be HTTPS' }

      - name: Require production signer to be pinned by the npx bootstrap
        shell: pwsh
        run: |
          $trust = Get-Content packages/operator-runtime-cli/trusted-signers.json -Raw | ConvertFrom-Json
          $expectedSubject = '${{ steps.certificate.outputs.publisher }}'
          $expectedFingerprint = '${{ steps.certificate.outputs.fingerprint_sha256 }}'
          $match = @($trust.signers | Where-Object { $_.subject -eq $expectedSubject -and $_.certificateSha256 -eq $expectedFingerprint })
          if ($match.Count -ne 1) { throw 'Production signing certificate is not pinned exactly once in operator-runtime-cli.' }

      - name: Install production-signed package through bootstrap and verify readiness
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = (Resolve-Path "artifacts/windows-release/Operator-$env:RELEASE_VERSION-x64.msix").Path
          $meta = (Resolve-Path artifacts/windows-release/release-metadata.json).Path
          $root = Join-Path $env:RUNNER_TEMP 'operator-production-authorized-root'
          $package = $null
          try {
            & node packages/operator-runtime-cli/scripts/ci-bootstrap-smoke.mjs $meta $msix '${{ steps.certificate.outputs.publisher }}' '${{ steps.certificate.outputs.fingerprint_sha256 }}' $root
            if ($LASTEXITCODE -ne 0) { throw "production bootstrap smoke failed with exit code $LASTEXITCODE" }
            $package = Get-AppxPackage -Name 'Operator.Runtime' | Select-Object -First 1
            if (-not $package) { throw 'Operator.Runtime production package was not registered' }
            $launcher = Join-Path $package.InstallLocation 'Operator.exe'
            $output = & $launcher --self-test
            if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch 'operator-launcher-self-test:ok') { throw 'production packaged launcher self-test failed' }
            $agent = Invoke-RestMethod -Uri 'http://127.0.0.1:47100/health' -TimeoutSec 2
            if (-not $agent.ok -or $agent.service -ne 'operator-local-agent') { throw 'production installed local agent health check failed' }
            $mcp = Invoke-RestMethod -Uri 'http://127.0.0.1:47200/health' -TimeoutSec 2
            if (-not $mcp.ok -or $mcp.service -ne 'operator-mcp-server') { throw 'production installed MCP health check failed' }
          } finally {
            if ($package) {
              $bundledNode = Join-Path $package.InstallLocation 'runtime\node.exe'
              Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $bundledNode } | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -LiteralPath (Join-Path $env:LOCALAPPDATA 'Operator') -Recurse -Force -ErrorAction SilentlyContinue
            Get-AppxPackage -Name 'Operator.Runtime' | Remove-AppxPackage -ErrorAction SilentlyContinue
          }

      - name: Publish immutable GitHub Release assets
        if: ${{ inputs.publish_github_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite published artifacts." }
          $msix = "artifacts/windows-release/Operator-$env:RELEASE_VERSION-x64.msix"
          gh release create $tag $msix artifacts/windows-release/Operator.appinstaller artifacts/windows-release/release-metadata.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Operator $env:RELEASE_VERSION" --notes "Verified timestamp-signed Operator Windows release." --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($release.draft -or $release.prerelease) { throw 'Published GitHub Release must be final, not draft/prerelease.' }
          if ($release.target_commitish -ne $env:GITHUB_SHA) { throw 'Published GitHub Release does not target the exact verified commit.' }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in @("Operator-$env:RELEASE_VERSION-x64.msix", 'Operator.appinstaller', 'release-metadata.json')) {
            if ($required -notin $names) { throw "Published GitHub Release is missing $required" }
          }

      - name: Remove local signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '${{ steps.certificate.outputs.pfx_path }}' -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-windows-production-${{ inputs.version }}
          path: |
            artifacts/windows-release/Operator-${{ inputs.version }}-x64.msix
            artifacts/windows-release/Operator.appinstaller
            artifacts/windows-release/release-metadata.json
          if-no-files-found: error
          retention-days: 14
