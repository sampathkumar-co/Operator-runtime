name: Generate npm lockfiles once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: "${{ github.event.head_commit.message == 'chore: trigger deterministic lockfile generation' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Generate lockfiles without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/mcp-server install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix apps/relay-server install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const expected = [
            ['apps/mcp-server/package-lock.json', '@operator/mcp-server'],
            ['apps/relay-server/package-lock.json', '@operator/relay-server']
          ];
          for (const [file, name] of expected) {
            const lock = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (lock.lockfileVersion !== 3) throw new Error(`${file}: expected lockfileVersion 3`);
            if (lock.packages?.['']?.name !== name) throw new Error(`${file}: unexpected root package name`);
          }
          NODE
      - name: Commit deterministic lockfiles and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .lockfile-generation-trigger .github/workflows/generate-lockfiles-once.yml
          git config user.name 'Operator CI'
          git config user.email 'operator-ci@example.invalid'
          git add -A
          git diff --cached --stat
          git commit -m 'chore: pin npm dependency lockfiles'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
