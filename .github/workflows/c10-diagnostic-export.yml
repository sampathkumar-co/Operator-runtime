name: C10 Redacted Support Diagnostic Export

on:
  pull_request:
    paths:
      - 'src/core/control-center-diagnostic-export.ts'
      - 'apps/local-agent/src/server.ts'
      - 'apps/local-agent/src/control-center-session.ts'
      - 'apps/local-agent/src/control-center.ts'
      - 'apps/control-center/src/**'
      - 'test/control-center-diagnostic-export.test.ts'
      - '.github/workflows/c10-diagnostic-export.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/control-center-diagnostic-export.ts'
      - 'apps/local-agent/src/server.ts'
      - 'apps/local-agent/src/control-center-session.ts'
      - 'apps/local-agent/src/control-center.ts'
      - 'apps/control-center/src/**'
      - 'test/control-center-diagnostic-export.test.ts'
      - '.github/workflows/c10-diagnostic-export.yml'
permissions:
  contents: read

jobs:
  redacted-and-same-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --experimental-strip-types --test test/control-center-diagnostic-export.test.ts test/control-center-browser-login.test.ts test/control-center-troubleshooting.test.ts
      - name: Verify canonical generated UI on checkout
        run: |
          node apps/control-center/scripts/build.mjs
          git diff --exit-code -- apps/local-agent/src/control-center.ts
      - name: No device or production artifact touched
        run: echo 'AUTHENTICATED_LOCAL_UI_ONLY;NO_SECRETS_OR_RECEIPTS;OWNER_DEVICE=NOT_RUN;NPM_UNCHANGED'
