name: R7 Enterprise Agent Control Plane

on:
  push:
    branches: ['main', 'program/r7-enterprise-control-plane-final-*']
  pull_request:
    paths:
      - 'src/core/principal-delegation.ts'
      - 'src/core/enterprise-authority-lease.ts'
      - 'src/core/enterprise-identity.ts'
      - 'src/core/enterprise-policy.ts'
      - 'src/core/enterprise-policy-language.ts'
      - 'src/core/enterprise-policy-history.ts'
      - 'src/core/enterprise-admin.ts'
      - 'src/core/control-plane-store.ts'
      - 'src/core/audit.ts'
      - 'src/core/index.ts'
      - 'test/r7-enterprise-control-plane.test.ts'
      - 'scripts/generate-r7-certification.ts'
      - 'package.json'
      - '.github/workflows/r7-enterprise-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r7-enterprise-control-plane-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused-certification:
    name: R7 enterprise control-plane certification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Production TypeScript boundary
        run: |
          npm --prefix apps/mcp-server ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/relay-server ci --ignore-scripts --no-audit --no-fund
          npm run typecheck:production
      - name: R7 exact-head suite
        run: npm run test:r7
      - name: Generate R7 exact-head evidence
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run evidence:r7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r7-enterprise-control-plane-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/r7/*
          if-no-files-found: error
          retention-days: 30
