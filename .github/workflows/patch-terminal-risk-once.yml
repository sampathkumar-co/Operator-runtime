name: Patch terminal risk once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'security: patch terminal risk classification once' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Correct terminal policy classification and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('apps/mcp-server/src/server.ts')
          s = p.read_text()
          old = "}, async ({ executable, args, cwd, timeoutMs }) => invoke('terminal.execute', 'write', { executable, args, cwd, timeoutMs }, cwd));"
          new = "}, async ({ executable, args, cwd, timeoutMs }) => invoke('terminal.execute', 'destructive', { executable, args, cwd, timeoutMs }, cwd));"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one terminal risk callsite, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/patch-terminal-risk-once.yml
          git config user.name 'Operator CI'
          git config user.email 'operator-ci@example.invalid'
          git add -A
          git diff --cached --check
          git diff --cached -- apps/mcp-server/src/server.ts
          git commit -m 'security: require destructive approval for terminal execution'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
