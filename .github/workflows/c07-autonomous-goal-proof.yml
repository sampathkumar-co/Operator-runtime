name: C07 Independent Autonomous Outcome Truth

on:
  pull_request:
    paths:
      - 'src/core/task-verifier.ts'
      - 'src/core/task-state-assertion.ts'
      - 'test/autonomous-proof-fail-closed.test.ts'
      - '.github/workflows/c07-autonomous-goal-proof.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/task-verifier.ts'
      - 'src/core/task-state-assertion.ts'
      - 'test/autonomous-proof-fail-closed.test.ts'
      - '.github/workflows/c07-autonomous-goal-proof.yml'

permissions:
  contents: read

jobs:
  fail-closed-goal-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Run independent autonomous postcondition truth regression
        run: node --experimental-strip-types --test test/autonomous-proof-fail-closed.test.ts test/verification-kernel.test.ts
