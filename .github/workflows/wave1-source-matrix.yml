name: Wave 1 source-only acceptance matrix

on:
  pull_request:
    paths:
      - 'docs/WAVE1_SOURCE_ACCEPTANCE_CENSUS_2026-10-25.md'
      - 'scripts/run-wave1-source-tests.mjs'
      - '.github/workflows/wave1-source-matrix.yml'
  push:
    branches: [main]
    paths:
      - 'docs/WAVE1_SOURCE_ACCEPTANCE_CENSUS_2026-10-25.md'
      - 'scripts/run-wave1-source-tests.mjs'
      - '.github/workflows/wave1-source-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave1-source-only:
    name: Wave1 source qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Compile Windows native filesystem identity helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./native/windows-path-lease/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows helper compilation failed' }
          $exe = (Resolve-Path native/windows-path-lease/target/release/operator-windows-path-lease.exe).Path
          "OPERATOR_WINDOWS_PATH_LEASE_PATH=$exe" >> $env:GITHUB_ENV
      - name: Run exact 44-task source-census gate and model-independent suites
        run: node scripts/run-wave1-source-tests.mjs
      - name: Report physical acceptance status without inventing measurements
        run: echo "SOURCE_ONLY PASS does not certify physical Windows, Chrome/Edge, user device, UAC or published npm"
