name: Wave 0 Source and Evaluation Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wave0-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wave0-source-and-lanes:
    name: Exact source identity and honest three-lane readiness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Validate Wave 0 manifests and evaluator fail-closed contracts
        run: node --experimental-strip-types --test test/wave0-source-manifest.test.ts test/wave0-evaluation-report.test.ts test/wave0-provider-census.test.ts test/wave0-step-evidence.test.ts
      - name: Capture exact source/package and NOT_RUN evaluation report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wave0"
          node scripts/wave0-source-manifest.mjs > "$RUNNER_TEMP/wave0/source-manifest.json"
          node scripts/wave0-evaluation-report.mjs > "$RUNNER_TEMP/wave0/evaluation-report.json"
          node --experimental-strip-types scripts/wave0-provider-census.ts > "$RUNNER_TEMP/wave0/provider-census.json"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[1]));const r=JSON.parse(fs.readFileSync(process.argv[2]));if(m.candidate.commit!==process.env.GITHUB_SHA||m.release.npmRegistryTarball.status!=='NOT_VERIFIED'||r.lanes.C.status!=='NOT_RUN'||r.releaseAcceptance!=='NOT_ACCEPTED')throw Error('Wave 0 provenance/NOT_RUN contract violated')" "$RUNNER_TEMP/wave0/source-manifest.json" "$RUNNER_TEMP/wave0/evaluation-report.json"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync(process.argv[1]));if(c.sourceCommit!==process.env.GITHUB_SHA||c.runtimeRegisteredProviderCount<15||c.declaredBuiltInRiskCount!==55||!c.boundaries.every(Boolean))throw Error('Wave 0 provider census invalid or pretending complete certification')" "$RUNNER_TEMP/wave0/provider-census.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave0-source-and-evaluation-${{ github.sha }}
          path: ${{ runner.temp }}/wave0/*.json
          retention-days: 30
          if-no-files-found: error
