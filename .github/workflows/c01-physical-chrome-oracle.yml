name: C01 Physical Chrome Oracle Source Contract

on:
  pull_request:
    paths:
      - 'scripts/certify-chrome-server-oracle.mjs'
      - 'test/physical-chrome-server-oracle.test.ts'
      - '.github/workflows/c01-physical-chrome-oracle.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/certify-chrome-server-oracle.mjs'
      - 'test/physical-chrome-server-oracle.test.ts'
      - '.github/workflows/c01-physical-chrome-oracle.yml'

permissions:
  contents: read

jobs:
  source-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --experimental-strip-types --test test/physical-chrome-server-oracle.test.ts
      - name: Disclose CI physical certification limitation
        run: echo "C01_PROVIDER_PHYSICAL_CHROME=NOT_RUN_IN_THIS_RUN; run explicitly on owner-authorized isolated physical Windows device"
