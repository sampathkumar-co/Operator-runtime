name: Harden CDP boundary once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'fix: harden CDP lifecycle and navigation proof once' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Patch CDP lifecycle, message bounds, and URL postcondition
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          page = Path('src/capabilities/browser-cdp-page.ts')
          s = page.read_text()
          old = "    return actual.origin === expected.origin && (actual.pathname === expected.pathname || actual.pathname.replace(/\\/$/, '') === expected.pathname.replace(/\\/$/, ''));"
          new = "    return actual.origin === expected.origin && actual.search === expected.search && (actual.pathname === expected.pathname || actual.pathname.replace(/\\/$/, '') === expected.pathname.replace(/\\/$/, ''));"
          if s.count(old) != 1:
              raise SystemExit(f'sameDestination anchor mismatch: {s.count(old)}')
          page.write_text(s.replace(old, new, 1))

          conn = Path('src/capabilities/browser-cdp-connection.ts')
          s = conn.read_text()
          replacements = [
            ("const DEFAULT_TIMEOUT_MS = 8_000;", "const DEFAULT_TIMEOUT_MS = 8_000;\nconst MAX_CDP_MESSAGE_BYTES = 4 * 1024 * 1024;"),
            ("    this.#ready = new Promise<void>((resolve, reject) => {\n      const timeout = setTimeout(() => reject(new OperatorError('CDP_CONNECT_TIMEOUT', 'Timed out connecting to browser target.', { retryable: true })), 4_000);\n      this.#socket.addEventListener('open', () => {\n        clearTimeout(timeout);\n        resolve();\n      }, { once: true });\n      this.#socket.addEventListener('error', () => {\n        clearTimeout(timeout);\n        reject(new OperatorError('CDP_CONNECT_FAILED', 'Failed to connect to browser target.', { retryable: true }));\n      }, { once: true });\n    });",
             "    this.#ready = new Promise<void>((resolve, reject) => {\n      let settled = false;\n      const finish = (callback: () => void) => {\n        if (settled) return;\n        settled = true;\n        clearTimeout(timeout);\n        callback();\n      };\n      const timeout = setTimeout(() => finish(() => {\n        this.#closed = true;\n        try { this.#socket.close(); } catch { /* timeout is already authoritative */ }\n        reject(new OperatorError('CDP_CONNECT_TIMEOUT', 'Timed out connecting to browser target.', { retryable: true }));\n      }), 4_000);\n      timeout.unref();\n      this.#socket.addEventListener('open', () => finish(resolve), { once: true });\n      this.#socket.addEventListener('error', () => finish(() => {\n        this.#closed = true;\n        try { this.#socket.close(); } catch { /* connection error is already authoritative */ }\n        reject(new OperatorError('CDP_CONNECT_FAILED', 'Failed to connect to browser target.', { retryable: true }));\n      }), { once: true });\n    });"),
            ("        const raw = typeof event.data === 'string' ? event.data : String(event.data);\n        const message = JSON.parse(raw) as {",
             "        const raw = typeof event.data === 'string' ? event.data : String(event.data);\n        if (Buffer.byteLength(raw, 'utf8') > MAX_CDP_MESSAGE_BYTES) {\n          this.close();\n          return;\n        }\n        const message = JSON.parse(raw) as {")
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'CDP anchor mismatch ({s.count(old)}): {old[:80]}')
              s = s.replace(old, new, 1)
          conn.write_text(s)
          PY
          rm -f .github/workflows/harden-cdp-boundary-once.yml
          git config user.name 'Operator CI'
          git config user.email 'operator-ci@example.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: strengthen CDP connection and navigation verification'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
