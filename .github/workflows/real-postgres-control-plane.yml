name: Real PostgreSQL Control-Plane Invariants

on:
  pull_request:
    paths:
      - 'src/core/control-plane-store.ts'
      - 'integration/postgres/**'
      - '.github/workflows/real-postgres-control-plane.yml'
  push:
    branches: ['main']
    paths:
      - 'src/core/control-plane-store.ts'
      - 'integration/postgres/**'
      - '.github/workflows/real-postgres-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: operator_test
          POSTGRES_PASSWORD: ephemeral-ci-only-secret
          POSTGRES_DB: operator_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U operator_test -d operator_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm --prefix integration/postgres ci --ignore-scripts --no-audit --no-fund
      - env:
          OPERATOR_REAL_PG_TEST: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: operator_test
          PGPASSWORD: ephemeral-ci-only-secret
          PGDATABASE: operator_test
        run: node --experimental-strip-types --test integration/postgres/real-control-plane.test.mjs
