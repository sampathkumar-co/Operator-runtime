name: C01 Paired Model-Controller Lane C Source Evidence
on:
  pull_request:
    paths:
      - 'scripts/c01-paired-lane-c.mjs'
      - 'test/c01-paired-lane-c.test.ts'
      - '.github/workflows/c01-paired-lane-c.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/c01-paired-lane-c.mjs'
      - 'test/c01-paired-lane-c.test.ts'
      - '.github/workflows/c01-paired-lane-c.yml'

permissions:
  contents: read
jobs:
  paired-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --experimental-strip-types --test test/c01-paired-lane-c.test.ts test/wave0-evaluation-report.test.ts
      - name: Disclose no real paired model source qualification
        run: echo 'LANE_C_RUNNER=INJECTED_TEST_STUBS;REAL_MODEL=NOT_RUN;MATCHED_50=NOT_RUN;PHYSICAL_ORACLE=NOT_CERTIFIED;RELEASE=NOT_ACCEPTED'
