            'native/operator-windows-dpapi.exe',
            'app/package.jso‰Ëˆ	Ø\Ø\ËÛØØ[XYÙ[ÜÜ˜ËÛXZ[‹ÉËˆ	Ø\Ø\ËÛØØ[XYÙ[ÜÜ˜ËØÛKÉËˆ	Ø\Ø\ËÛØØ[XYÙ[ÜÜ˜ËØ›ÛÝÝ˜\XÛÛ™šYËÉËˆ	Ø\Ø\ËÛXÜ\Ù\™\‹ÜÜ˜ËÜÙ\™\‹ÉËˆ	Ø\Ø\ËÛXÜ\Ù\™\‹Û›ÙWÛ[Ù[\ËÙ˜\ÝYžKÜXÚØYÙKšœÛÛ‰Ëˆ	Ø\Ø\ËÛXÜ\Ù\™\‹Û›ÙWÛ[Ù[\ËÐ[Ù[ÛÛ^›ÝØÛÛÜÙ\™\‹ÜXÚØYÙKšœÛÛ‰Ëˆ	Ø\ÜÜ˜ËØÛÜ™KÜ[[YKÉËˆ	Ð\X[šY™\Ýž[	Âˆ
