name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  core-runtime:
    name: Core runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check

  mcp-transport:
    name: MCP v2 transport + protocol E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Official MCP client round-trip
        run: npm run test:e2e

  windows-uia:
    name: Windows UIA native sidecar
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup default stable
          rustc --version
          cargo --version
      - name: Compile and test UIA sidecar
        run: cargo test --manifest-path native/windows-uia/Cargo.toml
      - name: Clippy UIA sidecar
        run: cargo clippy --manifest-path native/windows-uia/Cargo.toml --all-targets -- -D warnings
