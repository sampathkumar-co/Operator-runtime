name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  core-runtime:
    name: Core runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm run check
      - name: Validate publishable npx bootstrap surface
        shell: bash
        run: |
          set -euo pipefail
          node packages/operator-runtime-cli/bin/operator-runtime-cli.mjs --help
          (cd packages/operator-runtime-cli && npm pack --dry-run --json) > /tmp/operator-runtime-cli-pack.json
          node -e "const p=require('fs').readFileSync('/tmp/operator-runtime-cli-pack.json','utf8'); const j=JSON.parse(p)[0]; if (!j?.files?.some(f=>f.path==='bin/operator-runtime-cli.mjs')) process.exit(1)"

  security-red-team:
    name: Security red-team suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Cross-layer adversarial boundary tests
        run: npm run test:red-team

  performance-regression:
    name: Performance regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Bounded runtime performance budgets
        run: npm run test:performance

  node-supply-chain:
    name: Node dependency audit + CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Reproduce locked dependency graphs without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/mcp-server ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/relay-server ci --ignore-scripts --no-audit --no-fund
      - name: Block high production and critical full-graph vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/mcp-server audit --omit=dev --audit-level=high
          npm --prefix apps/relay-server audit --omit=dev --audit-level=high
          npm --prefix apps/mcp-server audit --audit-level=critical
          npm --prefix apps/relay-server audit --audit-level=critical
      - name: Generate and validate CycloneDX SBOMs from committed locks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/sbom
          (cd apps/mcp-server && npm sbom --package-lock-only --sbom-format cyclonedx > ../../artifacts/sbom/mcp-server.cdx.json)
          (cd apps/relay-server && npm sbom --package-lock-only --sbom-format cyclonedx > ../../artifacts/sbom/relay-server.cdx.json)
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['artifacts/sbom/mcp-server.cdx.json', 'artifacts/sbom/relay-server.cdx.json']) {
            const bom = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (bom.bomFormat !== 'CycloneDX') throw new Error(`${file}: not CycloneDX`);
            if (!Array.isArray(bom.components)) throw new Error(`${file}: components missing`);
            if (!bom.metadata?.component?.name) throw new Error(`${file}: root component metadata missing`);
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-node-cyclonedx-sbom
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30

  mcp-transport:
    name: MCP v2 client + Inspector E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Official MCP client + Inspector round-trip
        run: npm run test:e2e

  relay-transport:
    name: Relay WebSocket E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/relay-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real paired-device relay round-trip
        run: npm test

  windows-uia:
    name: Windows UIA native sidecar
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup default 1.98.0
          rustup component add clippy --toolchain 1.98.0
          rustc --version
          cargo --version
          cargo clippy --version
      - name: Compile and test UIA sidecar
        run: cargo test --locked --manifest-path native/windows-uia/Cargo.toml
      - name: Clippy UIA sidecar
        run: cargo clippy --locked --manifest-path native/windows-uia/Cargo.toml --all-targets -- -D warnings

  windows-dpapi:
    name: Windows DPAPI device-key helper
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup default 1.98.0
          rustup component add clippy --toolchain 1.98.0
          rustc --version
          cargo --version
          cargo clippy --version
      - name: Compile and test DPAPI helper
        shell: pwsh
        run: cargo test --locked --manifest-path native/windows-dpapi/Cargo.toml
      - name: Clippy DPAPI helper
        shell: pwsh
        run: cargo clippy --locked --manifest-path native/windows-dpapi/Cargo.toml --all-targets -- -D warnings
      - name: Release DPAPI round-trip self-test
        shell: pwsh
        run: |
          cargo build --locked --manifest-path native/windows-dpapi/Cargo.toml --release
          & ./native/windows-dpapi/target/release/operator-windows-dpapi.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI release helper self-test failed' }

  windows-release-package:
    name: Windows unsigned MSIX packaging
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup default 1.98.0
          rustup component add clippy --toolchain 1.98.0
          rustc --version
          cargo --version
          cargo clippy --version
      - name: Clippy release launcher
        shell: pwsh
        run: cargo clippy --locked --manifest-path native/windows-launcher/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned MSIX and App Installer metadata
        shell: pwsh
        run: ./packaging/windows/build-release.ps1 -Version 0.1.0.0 -UpdateBaseUri https://updates.example.invalid/operator
      - name: Unpack and validate release payload
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'makeappx.exe missing' }
          $msix = Resolve-Path artifacts/windows-release/Operator-0.1.0.0-x64.msix
          & $sdk.FullName unpack /p $msix /d artifacts/windows-release/unpacked /o
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx unpack failed' }
          $required = @(
            'Operator.exe',
            'runtime/node.exe',
            'native/operator-windows-uia.exe',
            'native/operator-windows-dpapi.exe',
            'app/package.json',
            'app/apps/local-agent/src/main.ts',
            'app/apps/local-agent/src/cli.ts',
            'app/apps/local-agent/src/bootstrap-config.ts',
            'app/apps/mcp-server/src/server.ts',
            'app/apps/mcp-server/node_modules/fastify/package.json',
            'app/apps/mcp-server/node_modules/@modelcontextprotocol/server/package.json',
            'app/src/core/runtime.ts',
            'AppxManifest.xml'
          )
          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path 'artifacts/windows-release/unpacked' $relative) -PathType Leaf)) { throw "Missing packaged file: $relative" }
          }
          $manifestText = Get-Content artifacts/windows-release/unpacked/AppxManifest.xml -Raw
          if ($manifestText -notmatch 'Alias="operator\.exe"') { throw 'Operator app execution alias is missing' }
          & artifacts/windows-release/unpacked/native/operator-windows-dpapi.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged DPAPI helper self-test failed' }
          $bootstrapState = Join-Path $env:LOCALAPPDATA 'Operator'
          $bootstrapRoot = Join-Path $env:RUNNER_TEMP 'operator-package-authorized-root'
          New-Item -ItemType Directory -Force -Path $bootstrapRoot | Out-Null
          Remove-Item -LiteralPath $bootstrapState -Recurse -Force -ErrorAction SilentlyContinue
          & artifacts/windows-release/unpacked/Operator.exe setup --root $bootstrapRoot --no-start
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Operator setup failed' }
          & artifacts/windows-release/unpacked/Operator.exe verify
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Operator verify failed' }
          Remove-Item -LiteralPath $bootstrapState -Recurse -Force -ErrorAction SilentlyContinue
          $meta = Get-Content artifacts/windows-release/release-metadata.json -Raw | ConvertFrom-Json
          if ($meta.signed -ne $false) { throw 'CI package must remain explicitly unsigned' }
          if ($meta.sha256 -ne (Get-FileHash $msix -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'release metadata hash mismatch' }
          [xml]$installer = Get-Content artifacts/windows-release/Operator.appinstaller -Raw
          if ($installer.AppInstaller.MainPackage.Uri -notmatch '^https://') { throw 'App Installer package URI must use HTTPS' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-windows-unsigned-msix
          path: |
            artifacts/windows-release/Operator-0.1.0.0-x64.msix
            artifacts/windows-release/Operator.appinstaller
            artifacts/windows-release/release-metadata.json
          if-no-files-found: error
          retention-days: 7

  public-edge-container:
    name: Public edge Linux container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Validate deployment invariants
        run: node --experimental-strip-types --test test/public-edge-deployment-config.test.ts
      - name: Create disposable deployment environment
        shell: bash
        run: |
          cat > deploy/public-edge/operator-edge.env <<'EOF'
          OPERATOR_RELAY_CONTROL_TOKEN=ci-relay-control-token-000000000000000000000000
          OPERATOR_MCP_PUBLIC_URL=https://edge.operator-runtime.dev/mcp
          OPERATOR_OAUTH_ISSUER=https://auth.operator-runtime.dev
          OPERATOR_OAUTH_AUTHORIZATION_URL=https://auth.operator-runtime.dev/authorize
          OPERATOR_OAUTH_TOKEN_URL=https://auth.operator-runtime.dev/token
          OPERATOR_OAUTH_INTROSPECTION_URL=https://auth.operator-runtime.dev/introspect
          OPERATOR_OAUTH_AUDIENCE=operator-runtime
          OPERATOR_OAUTH_REQUIRED_SCOPE=operator:mcp
          OPERATOR_OAUTH_INTROSPECTION_CLIENT_ID=ci-confidential-client
          OPERATOR_OAUTH_INTROSPECTION_CLIENT_SECRET=ci-only-not-a-real-secret
          EOF
      - name: Build and smoke hardened public edge
        shell: bash
        run: |
          set -euo pipefail
          compose='docker compose -f deploy/public-edge/compose.yml'
          $compose config --quiet
          $compose up -d --build --wait
          cid="$($compose ps -q operator-edge)"
          test -n "$cid"
          bindings="$(docker inspect "$cid" --format '{{json .HostConfig.PortBindings}}')"
          printf '%s\n' "$bindings" | grep -q '"47200/tcp"'
          printf '%s\n' "$bindings" | grep -q '"8788/tcp"'
          printf '%s\n' "$bindings" | grep -q '"8789/tcp"'
          ! printf '%s\n' "$bindings" | grep -q '8790'
          printf '%s\n' "$bindings" | grep -q '127.0.0.1'
          curl -fsS -H 'Host: edge.operator-runtime.dev' http://127.0.0.1:47200/health | grep -q 'operator-mcp-server'
          curl -fsS http://127.0.0.1:8788/health | grep -q 'operator-relay'
          curl -fsS http://127.0.0.1:8789/health | grep -q 'operator-relay-results'
          curl -fsS -H 'Host: edge.operator-runtime.dev' http://127.0.0.1:47200/.well-known/oauth-protected-resource/mcp | grep -q 'https://edge.operator-runtime.dev/mcp'
          status="$(curl -sS -o /tmp/operator-mcp-body -D /tmp/operator-mcp-headers -w '%{http_code}' -H 'Host: edge.operator-runtime.dev' -H 'Content-Type: application/json' -X POST --data '{}' http://127.0.0.1:47200/mcp)"
          test "$status" = '401'
          grep -qi '^www-authenticate: Bearer' /tmp/operator-mcp-headers
      - name: Public edge diagnostics
        if: failure()
        shell: bash
        run: docker compose -f deploy/public-edge/compose.yml logs --no-color || true
      - name: Stop public edge
        if: always()
        shell: bash
        run: docker compose -f deploy/public-edge/compose.yml down -v --remove-orphans || true
