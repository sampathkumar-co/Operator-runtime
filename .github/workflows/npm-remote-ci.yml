name: NPM Remote Runtime CI

on:
  # Every pushed SHA must produce release-source evidence; PR runs remain path-scoped below.
  push:
    branches: ['**']
  pull_request:
    paths:
      - 'packages/mecord-connect/**'
      - 'apps/local-agent/**'
      - 'src/**'
      - 'native/windows-dpapi/**'
      - 'native/windows-uia/**'
      - 'native/windows-path-lease/**'
      - 'test/npm-remote-runtime.test.ts'
      - 'test/npm-policy-continuity.test.ts'
      - 'scripts/verify-npm-policy-continuity.mjs'
      - '.github/workflows/npm-remote-ci.yml'

permissions:
  contents: read

concurrency:
  # Push runs must never cancel one another or collide with PR verification.
  # Only superseded PR runs may be canceled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-runtime:
    name: Windows npm runtime certification
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Prove mismatched source commit fails closed
        shell: pwsh
        env:
          OPERATOR_SOURCE_COMMIT: '0000000000000000000000000000000000000000'
        run: |
          node packages/mecord-connect/scripts/build-runtime-payload.mjs *> $env:RUNNER_TEMP/source-mismatch.log
          $code = $LASTEXITCODE
          Get-Content $env:RUNNER_TEMP/source-mismatch.log
          if ($code -eq 0) { throw 'runtime builder accepted a mismatched source commit' }
          if ((Get-Content $env:RUNNER_TEMP/source-mismatch.log -Raw) -notmatch 'does not match the checked-out Git HEAD') {
            throw 'runtime builder failed for an unexpected reason during source-mismatch regression'
          }
          exit 0

      - name: Install certified Rust toolchain
        shell: pwsh
        run: |
          rustup default 1.98.1
          rustup component add clippy --toolchain 1.98.1
          rustc --version
          cargo --version

      - name: Compile hardened Windows helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy --locked --manifest-path native/windows-dpapi/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI clippy failed' }
          cargo clippy --locked --manifest-path native/windows-uia/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'UIA clippy failed' }
          cargo build --locked --manifest-path native/windows-dpapi/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI build failed' }
          cargo build --locked --manifest-path native/windows-uia/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'UIA build failed' }
          ./native/windows-path-lease/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'path-lease build failed' }

      - name: Build exact-source runtime payload
        shell: pwsh
        env:
          OPERATOR_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node packages/mecord-connect/scripts/build-runtime-payload.mjs
          if ($LASTEXITCODE -ne 0) { throw 'runtime payload build failed' }

      - name: Run npm runtime security and publication gates
        shell: pwsh
        env:
          OPERATOR_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --experimental-strip-types --test test/npm-remote-runtime.test.ts test/npm-policy-continuity.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'npm remote security/policy tests failed' }
          node packages/mecord-connect/bin/operator.mjs doctor
          if ($LASTEXITCODE -ne 0) { throw 'runtime doctor failed' }
          node packages/mecord-connect/src/publish-check.mjs
          if ($LASTEXITCODE -ne 0) { throw 'publication source binding failed' }
          node packages/mecord-connect/scripts/test-required-relay-failure.mjs
          if ($LASTEXITCODE -ne 0) { throw 'required relay fail-closed test failed' }

      - name: Certify packed npm artifact
        id: candidate
        shell: pwsh
        env:
          OPERATOR_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packDir = Join-Path $env:RUNNER_TEMP 'mecrod-pack'
          $installDir = Join-Path $env:RUNNER_TEMP 'mecrod-install'
          New-Item -ItemType Directory -Force -Path $packDir, $installDir | Out-Null
          $pack = npm pack --json ./packages/mecord-connect --pack-destination $packDir | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pack.Count -ne 1) { throw 'npm pack failed' }
          $files = @($pack[0].files | ForEach-Object { $_.path })
          $pkg = Get-Content packages/mecord-connect/package.json -Raw | ConvertFrom-Json
          if ($pkg.name -ne 'mecord-connect') { throw 'unexpected Mecord Connect npm package name' }
          if ($pkg.license -ne 'SEE LICENSE IN LICENSE') { throw 'Mecord Connect proprietary license metadata is missing' }
          if (-not $pkg.contentPolicy -or $pkg.contentPolicy.class -ne 'dual-use') { throw 'Mecord Connect dual-use declaration is missing' }
          foreach ($policyFile in @('LICENSE', 'DISCLOSURE')) {
            if ($policyFile -notin $files) { throw "packed artifact missing $policyFile" }
          }
          foreach ($required in @(
            'bin/operator.mjs',
            'runtime/runtime-manifest.json',
            'runtime/native/operator-windows-dpapi.exe',
            'runtime/native/operator-windows-uia.exe',
            'runtime/native/operator-windows-path-lease.exe',
            'runtime/app/apps/local-agent/src/remote.js'
          )) {
            if ($required -notin $files) { throw "packed artifact missing $required" }
          }
          $typescriptRuntime = @($files | Where-Object { $_ -match '^runtime/.*\.ts$' })
          if ($typescriptRuntime.Count -ne 0) {
            throw "packed artifact must not contain TypeScript runtime files: $($typescriptRuntime -join ', ')"
          }
          $tgz = Join-Path $packDir $pack[0].filename
          $runtimeManifestPath = 'packages/mecord-connect/runtime/runtime-manifest.json'
          $runtimeManifest = Get-Content -LiteralPath $runtimeManifestPath -Raw | ConvertFrom-Json
          if ($runtimeManifest.sourceCommit -ne $env:OPERATOR_SOURCE_COMMIT) {
            throw "runtime manifest source $($runtimeManifest.sourceCommit) does not match workflow source $env:OPERATOR_SOURCE_COMMIT"
          }
          if ($runtimeManifest.version -ne $pkg.version) {
            throw "runtime manifest version $($runtimeManifest.version) does not match package version $($pkg.version)"
          }
          $tgzHash = (Get-FileHash -LiteralPath $tgz -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$tgz.sha256"
          Set-Content -LiteralPath $checksumPath -Value "$tgzHash  $($pack[0].filename)" -NoNewline -Encoding ascii
          $manifestHash = (Get-FileHash -LiteralPath $runtimeManifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $inventoryPath = Join-Path $packDir 'artifact-inventory.json'
          $inventory = [ordered]@{
            schemaVersion = 1
            package = [ordered]@{
              name = $pkg.name
              version = $pkg.version
              filename = $pack[0].filename
              sizeBytes = (Get-Item -LiteralPath $tgz).Length
              sha256 = $tgzHash
              integrity = $pack[0].integrity
            }
            source = [ordered]@{
              repository = $env:GITHUB_REPOSITORY
              commit = $env:OPERATOR_SOURCE_COMMIT
              workflow = $env:GITHUB_WORKFLOW
              runId = $env:GITHUB_RUN_ID
              runAttempt = $env:GITHUB_RUN_ATTEMPT
            }
            runtimeManifest = [ordered]@{
              sourceCommit = $runtimeManifest.sourceCommit
              sha256 = $manifestHash
              fileCount = @($runtimeManifest.files).Count
            }
            contents = @($pack[0].files | Sort-Object path | ForEach-Object {
              [ordered]@{ path = $_.path; sizeBytes = $_.size; mode = $_.mode }
            })
          }
          Set-Content -LiteralPath $inventoryPath -Value ($inventory | ConvertTo-Json -Depth 8) -Encoding utf8
          npm install --prefix $installDir --ignore-scripts $tgz
          if ($LASTEXITCODE -ne 0) { throw 'packed artifact install failed' }
          node (Join-Path $installDir 'node_modules/mecord-connect/bin/operator.mjs') doctor
          if ($LASTEXITCODE -ne 0) { throw 'installed runtime entrypoint doctor failed' }
          $shim = Join-Path $installDir 'node_modules/.bin/mecord-connect.cmd'
          if (-not (Test-Path -LiteralPath $shim -PathType Leaf)) { throw 'npm install did not create mecord-connect.cmd bin shim' }
          & $shim doctor
          if ($LASTEXITCODE -ne 0) { throw 'installed npm bin shim doctor failed' }
          $env:OPERATOR_AGENT_TOKEN = ''
          $env:OPERATOR_RECOVERY_TOKEN = ''
          $installedRemote = Join-Path $installDir 'node_modules/mecord-connect/runtime/app/apps/local-agent/src/remote.js'
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $remoteGuard = @(& node $installedRemote 2>&1)
            $remoteGuardCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if ($remoteGuardCode -eq 0 -or ($remoteGuard -join "`n") -notmatch 'requires an ephemeral local agent token') {
            throw "installed runtime did not execute from node_modules to the secure launcher guard: $($remoteGuard -join ' | ')"
          }
          $global:LASTEXITCODE = 0
          "package_version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "package_path=$tgz" >> $env:GITHUB_OUTPUT
          "package_sha256=$tgzHash" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
          "inventory_path=$inventoryPath" >> $env:GITHUB_OUTPUT

      - name: Upload exact-source npm candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mecord-connect-${{ steps.candidate.outputs.package_version }}-${{ github.sha }}
          path: |
            ${{ steps.candidate.outputs.package_path }}
            ${{ steps.candidate.outputs.checksum_path }}
            ${{ steps.candidate.outputs.inventory_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # A separate push-only job has OIDC/attestation authority; the PR-controlled
  # Windows build and its installation/security tests remain read-only.
  attest-candidate:
    name: Attest exact-source npm candidate (push only)
    if: github.event_name == 'push'
    needs: windows-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download immutable Windows candidate from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mecord-connect-2.0.6-${{ github.sha }}
          path: ${{ runner.temp }}/candidate

      - name: Verify candidate digest, inventory, and embedded source SHA
        id: verify
        shell: bash
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import tarfile

          folder = pathlib.Path(os.environ['CANDIDATE_DIR']).resolve(strict=True)
          expected = os.environ['EXPECTED_SOURCE'].lower()
          assert re.fullmatch(r'[0-9a-f]{40}', expected), 'invalid workflow source SHA'
          inventory = json.loads((folder / 'artifact-inventory.json').read_text(encoding='utf-8-sig'))
          package, source = inventory['package'], inventory['source']
          assert package['name'] == 'mecord-connect' and package['version'] == '2.0.6'
          assert source['repository'] == os.environ['GITHUB_REPOSITORY']
          assert source['commit'] == expected
          assert str(source['runId']) == os.environ['GITHUB_RUN_ID']
          assert package['filename'] == 'mecord-connect-2.0.6.tgz'
          assert set(p.name for p in folder.iterdir()) == {
              'artifact-inventory.json', package['filename'], package['filename'] + '.sha256'
          }, 'unexpected or missing candidate artifact files'
          tarball = folder / package['filename']
          digest = hashlib.sha256(tarball.read_bytes()).hexdigest()
          assert digest == package['sha256'], 'candidate inventory digest mismatch'
          assert tarball.stat().st_size == package['sizeBytes'], 'candidate size mismatch'
          checksum = (folder / (package['filename'] + '.sha256')).read_text(encoding='ascii')
          assert checksum.strip() == digest + '  ' + package['filename'], 'checksum file mismatch'
          with tarfile.open(tarball, 'r:gz') as archive:
              # Never execute any bytes from the untrusted build artifact.
              # Reject duplicate, special, or path-traversing tar entries.
              # Reject archive paths that Windows/npm could interpret as aliases.
              # Preserve a single canonical key for case-insensitive extraction.
              def windows_key(name):
                  assert isinstance(name, str) and name, 'empty archive path'
                  assert '\\' not in name, 'Windows alias separator in archive'
                  parts = name.split('/')
                  assert all(part not in ('', '.', '..') for part in parts), 'unsafe archive path'
                  for part in parts:
                      assert not any(ord(ch) < 32 or ch in '<>:"|?*' for ch in part), 'illegal Windows archive name'
                      assert not part.endswith((' ', '.')), 'trailing Windows archive alias'
                      stem = part.split('.')[0].upper()
                      assert stem not in {'CON', 'PRN', 'AUX', 'NUL', 'CONIN$', 'CONOUT$'}, 'Windows device name'
                      assert not re.fullmatch(r'(COM|LPT)[1-9¹²³]', stem), 'Windows device name'
                  return '/'.join(parts).casefold()

              file_map = {}
              member_names = set()
              for member in archive.getmembers():
                  # GNU sparse S is treated as a file by TarInfo.isfile(),
                  # but npm Windows tar extraction does not share its meaning.
                  assert member.type in (tarfile.REGTYPE, tarfile.AREGTYPE, tarfile.DIRTYPE), 'special archive member'
                  assert not getattr(member, 'sparse', None), 'GNU sparse archive member'
                  assert not any(k.startswith('GNU.sparse') for k in member.pax_headers), 'sparse PAX archive metadata'
                  name = member.name.rstrip('/') if member.isdir() else member.name
                  assert name == 'package' or name.startswith('package/'), 'unexpected archive root'
                  canonical = windows_key(name)
                  assert canonical not in member_names, 'duplicate Windows-canonical archive path'
                  member_names.add(canonical)
                  if member.isdir():
                      continue
                  assert member.type in (tarfile.REGTYPE, tarfile.AREGTYPE), 'non-regular file'
                  relative = name[len('package/'):]
                  file_map[relative] = member

              # No file may also be an ancestor directory of another member,
              # even if npm's tar omitted explicit directory headers.
              file_members = {windows_key('package/' + path) for path in file_map}
              for member_path in member_names:
                  segments = member_path.split('/')
                  for depth in range(1, len(segments)):
                      assert '/'.join(segments[:depth]) not in file_members, 'file ancestor collision'

              # Do not trust a self-consistent inventory to prove this is a
              # usable npm package. Independently require the install contract.
              required_package = {
                  'package.json', 'bin/operator.mjs', 'LICENSE',
                  'DISCLOSURE', 'runtime/runtime-manifest.json'
              }
              assert required_package <= set(file_map), 'missing required npm package files'
              assert all(file_map[path].size > 0 for path in required_package), 'empty required npm file'
              pkg_json_bytes = archive.extractfile(file_map['package.json']).read()
              pkg_json_text = pkg_json_bytes.decode('utf-8', errors='strict')
              assert not pkg_json_text.startswith('\ufeff'), 'npm package JSON UTF-8 BOM'
              embedded_pkg = json.loads(pkg_json_text)
              assert isinstance(embedded_pkg, dict), 'invalid embedded npm package metadata'
              assert embedded_pkg.get('name') == 'mecord-connect', 'embedded npm package identity'
              assert embedded_pkg.get('version') == package['version'], 'embedded npm version mismatch'
              assert embedded_pkg.get('license') == 'SEE LICENSE IN LICENSE', 'embedded npm license mismatch'
              assert embedded_pkg.get('contentPolicy') == {'class': 'dual-use'}, 'embedded dual-use disclosure mismatch'
              assert embedded_pkg.get('bin', {}).get('mecord-connect') == 'bin/operator.mjs', 'embedded npm CLI entrypoint mismatch'
              # npm install/npx execute lifecycle hooks unless prevented.
              # Match the actual approved source package's inert script set.
              approved_scripts = {
                  'build:runtime': 'node ./scripts/build-runtime-payload.mjs',
                  'prepublishOnly': 'node ./src/publish-check.mjs'
              }
              assert embedded_pkg.get('scripts') == approved_scripts, 'unexpected npm lifecycle scripts'
              assert embedded_pkg.get('type') == 'module', 'unexpected package module type'
              assert embedded_pkg.get('os') == ['win32'] and embedded_pkg.get('cpu') == ['x64'], 'npm OS/CPU contract mismatch'
              assert embedded_pkg.get('engines') == {
                  'node': '>=22.14.0 <23 || >=24.0.0 <25 || >=26.0.0 <27'
              }, 'npm supported Node contract mismatch'
              for dependency_key in (
                  'dependencies', 'devDependencies', 'optionalDependencies',
                  'peerDependencies', 'bundledDependencies', 'bundleDependencies'
              ):
                  assert dependency_key not in embedded_pkg, 'unexpected npm dependency/install authority'

              inventory_files = inventory['contents']
              assert len(inventory_files) == len(file_map), 'packed inventory count mismatch'
              assert {entry['path'] for entry in inventory_files} == set(file_map), 'packed inventory paths mismatch'
              for entry in inventory_files:
                  assert file_map[entry['path']].size == entry['sizeBytes'], 'packed inventory size mismatch'

              manifest_member = file_map.get('runtime/runtime-manifest.json')
              assert manifest_member is not None, 'packed runtime manifest missing'
              manifest_bytes = archive.extractfile(manifest_member).read()
              manifest_text = manifest_bytes.decode('utf-8', errors='strict')
              assert not manifest_text.startswith('\ufeff'), 'runtime manifest UTF-8 BOM'
              manifest = json.loads(manifest_text)
              # Enforce the installed CLI's validateRuntimeManifest contract,
              # not just the untrusted tarball's self-consistent inventory.
              assert isinstance(manifest, dict), 'runtime manifest not an object'
              assert type(manifest.get('schemaVersion')) is int and manifest['schemaVersion'] == 1, 'manifest schema version'
              assert manifest.get('package') == 'mecord-connect', 'manifest package identity'
              assert manifest.get('platform') == 'win32' and manifest.get('arch') == 'x64', 'manifest platform identity'
              assert manifest['version'] == package['version'], 'packed version mismatch'
              assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', manifest['version']), 'invalid runtime version'
              assert manifest['sourceCommit'] == expected, 'packed source SHA mismatch'
              assert inventory['runtimeManifest']['sourceCommit'] == expected
              assert inventory['runtimeManifest']['sha256'] == hashlib.sha256(manifest_bytes).hexdigest()
              declared_files = manifest['files']
              assert isinstance(declared_files, list) and 5 <= len(declared_files) <= 4096, 'runtime manifest list limits'
              assert inventory['runtimeManifest']['fileCount'] == len(declared_files)
              required_runtime = {
                  'app/apps/local-agent/src/remote.js',
                  'app/apps/local-agent/src/benchmark-runner.js',
                  'native/operator-windows-dpapi.exe',
                  'native/operator-windows-uia.exe',
                  'native/operator-windows-path-lease.exe'
              }
              runtime_declared = set()
              for entry in declared_files:
                  assert isinstance(entry, dict), 'invalid runtime manifest entry'
                  relative = entry['path']
                  assert isinstance(relative, str) and relative, 'invalid runtime manifest path'
                  assert windows_key('package/runtime/' + relative) == ('package/runtime/' + relative).casefold(), 'unsafe runtime manifest path'
                  assert type(entry['sizeBytes']) is int and 1 <= entry['sizeBytes'] <= 64 * 1024 * 1024, 'runtime manifest size limit'
                  assert isinstance(entry['sha256'], str) and re.fullmatch(r'[0-9a-f]{64}', entry['sha256']), 'runtime manifest digest'
                  canonical = relative.casefold()
                  assert canonical not in runtime_declared, 'duplicate Windows-canonical runtime path'
                  runtime_declared.add(canonical)
              assert required_runtime <= {e['path'] for e in declared_files}, 'missing required native/runtime files'
              assert len(runtime_declared) == len(declared_files), 'duplicate runtime manifest path'
              runtime_actual = {p[len('runtime/'):].casefold() for p in file_map if p.casefold().startswith('runtime/')}
              assert runtime_actual == runtime_declared | {'runtime-manifest.json'}, 'runtime file set mismatch'

              # Independently hash every compiled JS/native runtime byte from the
              # downloaded tarball against the embedded manifest, not just its count.
              for entry in declared_files:
                  archived = file_map['runtime/' + entry['path']]
                  assert archived.size == entry['sizeBytes'], 'runtime file size mismatch'
                  content = archive.extractfile(archived).read()
                  assert hashlib.sha256(content).hexdigest() == entry['sha256'], 'runtime file digest mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('subject_path=' + str(tarball) + chr(10))
          print('EXACT_SOURCE_NPM_CANDIDATE_VERIFIED', expected, digest)
          PY

      - name: Attest verified candidate with push-only authority
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ steps.verify.outputs.subject_path }}

  node-compatibility:
    name: Node ${{ matrix.node }} launcher compatibility
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.2', '24.21.0', '26.8.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Exercise TypeScript stripping and launcher contract
        shell: pwsh
        run: |
          node --version
          node --experimental-strip-types --test test/npm-remote-runtime.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Node compatibility tests failed' }
          node packages/mecord-connect/bin/operator.mjs --help
          if ($LASTEXITCODE -ne 0) { throw 'launcher help smoke failed' }
