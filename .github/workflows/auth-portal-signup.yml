name: Auth portal signup integration

on:
  push:
    paths:
      - 'deploy/auth-portal/**'
      - '.github/workflows/auth-portal-signup.yml'
  pull_request:
    paths:
      - 'deploy/auth-portal/**'
      - '.github/workflows/auth-portal-signup.yml'

permissions:
  contents: read

jobs:
  open-signup-runtime:
    name: Auth portal runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install exact auth-portal dependencies
        run: npm ci --prefix deploy/auth-portal --no-audit --no-fund
      - name: Exercise actual signup runtime and boundaries
        run: node --experimental-strip-types --test deploy/auth-portal/test/open-signup-runtime.test.ts
