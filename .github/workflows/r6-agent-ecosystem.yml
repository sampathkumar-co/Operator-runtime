name: R6 Universal Agent Gateway Ecosystem

on:
  push:
    branches: ['program/r6-agent-ecosystem-final-*']
  pull_request:
    paths:
      - 'src/core/capability-sdk.ts'
      - 'src/core/capability-conformance.ts'
      - 'src/core/capability-package-registry.ts'
      - 'src/core/agent-gateway-contract.ts'
      - 'src/core/contract-registry.ts'
      - 'src/core/index.ts'
      - 'packages/mecord-capability-sdk/**'
      - 'sdk/python/**'
      - 'schemas/capability/**'
      - 'scripts/r6-**'
      - 'test/capability-conformance.test.ts'
      - 'test/capability-package-registry.test.ts'
      - 'test/gateway-enterprise-foundation.test.ts'
      - 'test/r6-**'
      - 'package.json'
      - 'workspace-layout.json'
      - 'tsconfig.production.json'
      - '.github/workflows/r6-agent-ecosystem.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r6-agent-ecosystem-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused-certification:
    name: R6 ecosystem certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Production TypeScript boundary
        run: |
          npm --prefix apps/mcp-server ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/relay-server ci --ignore-scripts --no-audit --no-fund
          npm run typecheck:production
      - name: Python SDK runtime
        run: python --version
      - name: R6 exact-head suite
        run: npm run test:r6
