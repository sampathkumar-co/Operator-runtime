name: R1 Canonical Runtime

on:
  push:
    branches: ['main', 'program/**']
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fast-pr:
    if: github.event_name != 'schedule'
    name: R1 fast PR type + contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm --prefix apps/mcp-server ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/relay-server ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck:production
      - run: node --experimental-strip-types --test test/r1-canonical-runtime.test.ts
      - run: npm run verify:r1-source

  integration:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: R1 integration qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm run check
      - run: npm run test:hardening

  nightly-fault:
    if: github.event_name == 'schedule'
    name: R1 nightly fault qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm run qualify

  release-candidate:
    if: github.event_name == 'push'
    needs: [fast-pr, integration]
    name: R1 immutable release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm run verify:r1-source
      - run: npm run evidence:r1
        env:
          R1_QUALIFICATION_LANE: release-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-release-evidence-${{ github.sha }}
          path: artifacts/r1/*
          if-no-files-found: error
          retention-days: 30
