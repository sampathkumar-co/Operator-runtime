name: NPM Bootstrap Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Four-part production MSIX release version already published on GitHub
        required: true
        type: string
      npm_tag:
        description: npm dist-tag for operator-runtime-cli
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish operator-runtime-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
          registry-url: https://registry.npmjs.org
      - name: Validate release inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'release_version must be a four-part MSIX version' >&2; exit 1; }
          [[ "$NPM_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || { echo 'invalid npm dist-tag' >&2; exit 1; }

      - name: Bootstrap security tests
        run: node --experimental-strip-types --test test/npx-bootstrap.test.ts
      - name: Validate publishable tarball
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json ./packages/operator-runtime-cli > /tmp/operator-runtime-cli-pack.json
          node <<'NODE'
          const data = JSON.parse(require('fs').readFileSync('/tmp/operator-runtime-cli-pack.json', 'utf8'))[0];
          const files = new Set((data.files || []).map((file) => file.path));
          for (const required of ['bin/operator-runtime-cli.mjs','src/cli.mjs','src/release.mjs','src/windows.mjs','src/publish-check.mjs','trusted-signers.json']) {
            if (!files.has(required)) throw new Error(`missing npm payload file: ${required}`);
          }
          NODE
      - name: Require published timestamped production release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { loadTrustedSigners, fetchReleaseMetadata, DEFAULT_MANIFEST_URL } from './packages/operator-runtime-cli/src/release.mjs';

          const version = process.env.RELEASE_VERSION;
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          const tag = `v${version}`;
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${token}`,
            'x-github-api-version': '2022-11-28'
          };

          const releaseResponse = await fetch(`https://api.github.com/repos/${repository}/releases/tags/${encodeURIComponent(tag)}`, { headers });
          if (!releaseResponse.ok) throw new Error(`GitHub production release ${tag} is not published (HTTP ${releaseResponse.status}).`);
          const release = await releaseResponse.json();
          if (release.draft) throw new Error(`GitHub production release ${tag} is still a draft.`);
          if (release.prerelease) throw new Error(`GitHub production release ${tag} is marked prerelease.`);

          const assets = new Map((release.assets ?? []).map((asset) => [asset.name, asset]));
          for (const name of [`Operator-${version}-x64.msix`, 'Operator.appinstaller', 'release-metadata.json']) {
            if (!assets.has(name)) throw new Error(`GitHub production release ${tag} is missing ${name}.`);
          }

          const taggedManifestUrl = assets.get('release-metadata.json').browser_download_url;
          const taggedMetadata = await fetchReleaseMetadata(taggedManifestUrl);
          if (taggedMetadata.version !== version) throw new Error(`Tagged release metadata version ${taggedMetadata.version} does not match requested ${version}.`);

          const latestMetadata = await fetchReleaseMetadata(DEFAULT_MANIFEST_URL);
          if (latestMetadata.version !== version) {
            throw new Error(`GitHub latest release is ${latestMetadata.version}, not requested production release ${version}.`);
          }
          if (latestMetadata.sha256 !== taggedMetadata.sha256 || latestMetadata.signerCertificateSha256 !== taggedMetadata.signerCertificateSha256) {
            throw new Error('GitHub latest release metadata does not match the requested immutable release.');
          }

          const msixAsset = assets.get(taggedMetadata.artifact);
          if (Number(msixAsset.size) !== taggedMetadata.sizeBytes) throw new Error('GitHub MSIX asset size does not match signed release metadata.');

          const trustedSigners = await loadTrustedSigners('./packages/operator-runtime-cli/trusted-signers.json');
          const matches = trustedSigners.filter((entry) =>
            entry.subject === taggedMetadata.signerSubject &&
            entry.certificateSha256 === taggedMetadata.signerCertificateSha256
          );
          if (matches.length !== 1) throw new Error('Published production release signer is not pinned exactly once by operator-runtime-cli.');

          console.log(`npm publication gate: PASS (${tag}, timestamped signer pinned, latest release verified)`);
          NODE
      - name: Publish npm bootstrap
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: npm publish ./packages/operator-runtime-cli --access public --tag "$NPM_TAG"
