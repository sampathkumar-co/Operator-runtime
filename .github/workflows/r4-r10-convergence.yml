name: R4-R10 Convergence

on:
  push:
    branches: ['program/r4-r10-completion-*']
  pull_request:
    paths:
      - 'src/core/**'
      - 'apps/local-agent/src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/r4-r10-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r4-r10-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  focused-certification:
    name: R4-R10 focused certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Production TypeScript boundary
        run: |
          npm --prefix apps/mcp-server ci --ignore-scripts --no-audit --no-fund
          npm --prefix apps/relay-server ci --ignore-scripts --no-audit --no-fund
          npm run typecheck:production
      - name: R4-R10 exact-head suite
        run: npm run test:r4-r10
