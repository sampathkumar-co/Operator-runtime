name: C01 Sanitized Stepwise Evaluation Receipts
on:
  pull_request:
    paths:
      - 'scripts/c01-sanitized-stepwise-trace.mjs'
      - 'test/c01-sanitized-stepwise-trace.test.ts'
      - '.github/workflows/c01-stepwise-receipts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/c01-sanitized-stepwise-trace.mjs'
      - 'test/c01-sanitized-stepwise-trace.test.ts'
      - '.github/workflows/c01-stepwise-receipts.yml'
permissions:
  contents: read
jobs:
  no-sensitive-evidence-export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --experimental-strip-types --test test/c01-sanitized-stepwise-trace.test.ts test/wave0-evaluation-report.test.ts
      - run: echo 'EVIDENCE=SOURCE_TESTS;REAL_SCORER=NOT_RUN;OWNER_DEVICE=NOT_ATTESTED;RELEASE=NOT_ACCEPTED'
