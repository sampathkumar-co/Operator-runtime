name: P0 Live PostgreSQL CAS
on:
  pull_request:
    paths:
      - 'src/core/control-plane-store.ts'
      - 'src/core/control-plane-restore-witness.ts'
      - 'scripts/certify-control-plane-live-postgres.mjs'
      - '.github/workflows/control-plane-live-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/control-plane-store.ts'
      - 'src/core/control-plane-restore-witness.ts'
      - 'scripts/certify-control-plane-live-postgres.mjs'
      - '.github/workflows/control-plane-live-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgresql-cas:
    name: Real PostgreSQL 18 generation and stale-writer fencing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: mecord_cert
          POSTGRES_PASSWORD: synthetic-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mecord_cert -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install isolated PostgreSQL test driver (not a runtime dependency)
        run: npm install --prefix "$RUNNER_TEMP/pg-driver" --ignore-scripts --no-save --no-audit --no-fund pg@8.16.3
      - name: Verify real PostgreSQL CAS, ABA and legacy-writer fencing
        env:
          MECORD_TEST_PG_MODULE: ${{ runner.temp }}/pg-driver/node_modules/pg/lib/index.js
          MECORD_TEST_PG_PORT: '5432'
          MECORD_TEST_PG_PASSWORD: synthetic-fixture-only
        run: node --experimental-strip-types scripts/certify-control-plane-live-postgres.mjs
