name: Durable state hardening once

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply hardening and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/durable-state-hardening.py
          rm .github/scripts/durable-state-hardening.py
          rm .github/workflows/durable-state-hardening-once.yml
          git config user.name 'Operator CI'
          git config user.email 'operator-ci@example.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'security: harden durable state file boundaries'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
