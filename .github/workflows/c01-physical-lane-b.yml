name: C01 Physical Chrome Lane B Evidence Contract

on:
  pull_request:
    paths:
      - 'scripts/c01-physical-lane-b-records.mjs'
      - 'scripts/certify-chrome-server-oracle.mjs'
      - 'test/c01-physical-lane-b-records.test.ts'
      - '.github/workflows/c01-physical-lane-b.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/c01-physical-lane-b-records.mjs'
      - 'scripts/certify-chrome-server-oracle.mjs'
      - 'test/c01-physical-lane-b-records.test.ts'
      - '.github/workflows/c01-physical-lane-b.yml'

permissions:
  contents: read

jobs:
  evaluation-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --experimental-strip-types --test test/c01-physical-lane-b-records.test.ts test/physical-chrome-server-oracle.test.ts test/wave0-evaluation-report.test.ts
      - run: echo 'LANE_B_PHYSICAL=NOT_RUN_IN_CI;FULL_50_HOLDOUT=NOT_RUN;LANE_A_C=NOT_RUN;PUBLICATION=NOT_AUTHORIZED'
