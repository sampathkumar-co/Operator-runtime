name: C05 Provider-neutral Bounded Model Inference

on:
  pull_request:
    paths:
      - 'src/core/bounded-model-goal-inference.ts'
      - 'test/bounded-model-goal-inference.test.ts'
      - '.github/workflows/c05-model-inference.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/bounded-model-goal-inference.ts'
      - 'test/bounded-model-goal-inference.test.ts'
      - '.github/workflows/c05-model-inference.yml'

permissions:
  contents: read

jobs:
  bounded-model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Verify pure provider-neutral planning does not dispatch actions or call real inference
        run: node --experimental-strip-types --test test/bounded-model-goal-inference.test.ts test/model-goal-proposal.test.ts test/task-proposal-review.test.ts test/reviewed-model-goal.test.ts
