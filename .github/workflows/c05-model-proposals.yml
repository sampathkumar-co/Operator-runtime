name: C05 Scoped Model Goal Proposal Contracts

on:
  pull_request:
    paths:
      - 'src/core/model-goal-proposal.ts'
      - 'test/model-goal-proposal.test.ts'
      - '.github/workflows/c05-model-proposals.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/model-goal-proposal.ts'
      - 'test/model-goal-proposal.test.ts'
      - '.github/workflows/c05-model-proposals.yml'

permissions:
  contents: read

jobs:
  source-model-proposal-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --experimental-strip-types --test test/model-goal-proposal.test.ts
