name: C01 Isolated MiniWoB Controller Source

on:
  pull_request:
    paths:
      - 'benchmarks/miniwob/**'
      - '.github/workflows/c01-miniwob-controller-source.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/miniwob/**'
      - '.github/workflows/c01-miniwob-controller-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-source-contract:
    name: Offline synthetic controller unit tests (no model/CDP)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          persist-credentials: false
      - name: Run pure Python controller fixtures without dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s benchmarks/miniwob -p 'test_*.py' -v
      - name: Reject ambient credentials, model API/network calls and installed-env mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path
          source = Path('benchmarks/miniwob/controller.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          modules = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import): modules.extend(n.name.split('.')[0] for n in node.names)
              if isinstance(node, ast.ImportFrom) and node.module:
                  modules.append(node.module.split('.')[0])
          allowed = {'json', 'hashlib', 're', 'dataclasses', 'typing', '__future__'}
          unexpected = set(modules) - allowed
          if unexpected: raise SystemExit(f'FORBIDDEN_CONTROLLER_IMPORT: {sorted(unexpected)}')
          forbidden_calls = {'eval', 'exec', 'compile', '__import__', 'open'}
          calls = {n.func.id for n in ast.walk(tree)
                   if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)}
          if calls & forbidden_calls: raise SystemExit(f'FORBIDDEN_CONTROLLER_CALL: {calls & forbidden_calls}')
          print('CONTROLLER_OFFLINE_AUTHORITY=PASS')
          PY
