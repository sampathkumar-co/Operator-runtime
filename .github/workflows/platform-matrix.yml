name: Platform Matrix

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  portable-runtime:
    name: Runtime ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Import and full runtime test suite
        run: npm run check
