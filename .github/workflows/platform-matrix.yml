name: Platform Matrix

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable-runtime:
    name: Runtime ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Build real Windows native security helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup default 1.98.1
          cargo build --locked --manifest-path native/windows-dpapi/Cargo.toml --release
          $helper = (Resolve-Path native/windows-dpapi/target/release/operator-windows-dpapi.exe).Path
          "OPERATOR_WINDOWS_DPAPI_PATH=$helper" >> $env:GITHUB_ENV
          ./native/windows-path-lease/build.ps1
          $pathLease = (Resolve-Path native/windows-path-lease/target/release/operator-windows-path-lease.exe).Path
          "OPERATOR_WINDOWS_PATH_LEASE_PATH=$pathLease" >> $env:GITHUB_ENV
      - name: Import and full runtime test suite
        run: npm run check
