name: Patch relay timer once

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/core/relay-client.ts')
          s = p.read_text()
          old = "    timer.unref();\n    const cleanup = () => {"
          if s.count(old) != 1:
              raise SystemExit(f'expected one connect timer unref, found {s.count(old)}')
          p.write_text(s.replace(old, "    const cleanup = () => {", 1))
          PY
          rm .github/workflows/patch-relay-timer-once.yml
          git config user.name 'Operator CI'
          git config user.email 'operator-ci@example.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: keep relay connect timeout authoritative'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
