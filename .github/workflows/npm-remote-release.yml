name: NPM Remote Release

on:
  push:
    branches:
      - main
      - release/npm-206-rc1-preparation-20261012
      - release/npm-206-rc2-relay-recovery-20261013
      - release/npm-206-rc3-relay-hardening-20261013
    paths:
      - '.release/npm-runtime-stage-request.json'
      - '.release/npm-rc1-activation.json'
      - '.release/npm-rc2-activation.json'
      - '.release/npm-rc3-activation.json'
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag for mecord-connect
        required: true
        default: latest
        type: string
      publication_mode:
        description: Build first-release artifact or stage a later release
        required: true
        default: artifact
        type: choice
        options:
          - artifact
          - stage

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: mecord-connect-production-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.modified, '.release/npm-runtime-stage-request.json') || contains(github.event.head_commit.added, '.release/npm-runtime-stage-request.json'))
    name: Build and hand off mecord-connect
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Validate checked-in npm stage request
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $request = Get-Content .release/npm-runtime-stage-request.json -Raw | ConvertFrom-Json
          $pkg = Get-Content packages/mecord-connect/package.json -Raw | ConvertFrom-Json
          if ($request.enabled -ne $true) { throw 'npm stage request is not enabled' }
          if ($request.version -ne $pkg.version) { throw "stage request version $($request.version) does not match package version $($pkg.version)" }
          if ($request.npmTag -ne 'latest') { throw 'automatic stage request must target latest' }
          if ($request.publicationMode -ne 'stage') { throw 'automatic release request must use stage mode' }

      - name: Require PR-certified green main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPERATOR_RELEASE_SOURCE_WAIT_MS: ${{ github.event_name == 'push' && '1200000' || '0' }}
        run: node scripts/verify-release-source.mjs

      - name: Validate npm tag
        shell: pwsh
        env:
          NPM_TAG: ${{ github.event_name == 'push' && 'latest' || inputs.npm_tag }}
        run: |
          if ($env:NPM_TAG -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$') {
            throw 'invalid npm dist-tag'
          }
          $pkg = Get-Content packages/mecord-connect/package.json -Raw | ConvertFrom-Json
          if ($pkg.version -match '-rc\.' -and $env:NPM_TAG -ne 'next') {
            throw 'release candidate can only be staged under next, never latest'
          }

      - name: Install certified Rust toolchain
        shell: pwsh
        run: |
          rustup default 1.98.1
          rustup component add clippy --toolchain 1.98.1
          rustc --version
          cargo --version

      - name: Require resolved public distribution metadata
        shell: pwsh
        run: |
          $pkg = Get-Content packages/mecord-connect/package.json -Raw | ConvertFrom-Json
          if ($pkg.name -ne 'mecord-connect') {
            throw 'public npm release package name must be mecord-connect'
          }
          if ($pkg.license -ne 'SEE LICENSE IN LICENSE') {
            throw 'Mecord Connect public npm release requires the owner-approved proprietary LICENSE'
          }
          if (-not (Test-Path -LiteralPath 'packages/mecord-connect/LICENSE' -PathType Leaf)) {
            throw 'Mecord Connect public npm release requires packages/mecord-connect/LICENSE'
          }
          if (-not $pkg.contentPolicy -or $pkg.contentPolicy.class -ne 'dual-use') {
            throw 'Mecord Connect public npm release must declare contentPolicy.class as dual-use'
          }
          if (-not (Test-Path -LiteralPath 'packages/mecord-connect/DISCLOSURE' -PathType Leaf)) {
            throw 'declared dual-use package requires packages/mecord-connect/DISCLOSURE'
          }
          if ($pkg.author.name -ne 'Kinthala Samuel Sampath Kumar') {
            throw 'Mecord Connect npm author must match the approved individual publisher identity'
          }

      - name: Preserve npm dual-use declaration continuity
        run: node scripts/verify-npm-policy-continuity.mjs

      - name: Build Windows security helpers from locked source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo clippy --locked --manifest-path native/windows-dpapi/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI clippy failed' }
          cargo clippy --locked --manifest-path native/windows-uia/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'UIA clippy failed' }
          cargo build --locked --manifest-path native/windows-dpapi/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI release build failed' }
          cargo build --locked --manifest-path native/windows-uia/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { throw 'UIA release build failed' }
          ./native/windows-path-lease/build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'path-lease release build failed' }

      - name: Exercise native helper self-tests
        shell: pwsh
        run: |
          & ./native/windows-dpapi/target/release/operator-windows-dpapi.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI self-test failed' }
          & ./native/windows-path-lease/target/release/operator-windows-path-lease.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'path-lease self-test failed' }

      - name: Build canonical runtime payload
        shell: pwsh
        env:
          OPERATOR_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node packages/mecord-connect/scripts/build-runtime-payload.mjs
          if ($LASTEXITCODE -ne 0) { throw 'runtime payload build failed' }

      - name: Remote CLI security tests
        shell: pwsh
        run: |
          node --experimental-strip-types --test test/npm-remote-runtime.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'remote CLI tests failed' }
          node packages/mecord-connect/bin/operator.mjs doctor
          if ($LASTEXITCODE -ne 0) { throw 'packaged runtime doctor failed' }
          node packages/mecord-connect/scripts/test-required-relay-failure.mjs
          if ($LASTEXITCODE -ne 0) { throw 'required relay fail-closed test failed' }

      - name: Validate publishable tarball and installed-package doctor
        id: pack
        shell: pwsh
        env:
          OPERATOR_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packDir = Join-Path $env:RUNNER_TEMP 'operator-pack'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'operator-pack-smoke'
          New-Item -ItemType Directory -Force -Path $packDir, $smokeDir | Out-Null
          $json = npm pack --json ./packages/mecord-connect --pack-destination $packDir | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $json.Count -ne 1) { throw 'npm pack failed' }
          $files = @($json[0].files | ForEach-Object { $_.path })
          $pkg = Get-Content packages/mecord-connect/package.json -Raw | ConvertFrom-Json
          if ($pkg.license -like 'SEE LICENSE IN *') {
            $licenseFile = $pkg.license.Substring('SEE LICENSE IN '.Length).Trim()
            if ($licenseFile -notin $files) { throw "npm tarball missing declared license file $licenseFile" }
          } elseif (-not ($files | Where-Object { $_ -match '^(?i:licen[cs]e)(?:[._-].*)?$' })) {
            throw 'npm tarball missing a root license file for the declared software license'
          }
          if ($pkg.contentPolicy -and $pkg.contentPolicy.class -eq 'dual-use' -and 'DISCLOSURE' -notin $files) {
            throw 'declared dual-use npm tarball is missing root DISCLOSURE'
          }
          foreach ($required in @(
            'bin/operator.mjs',
            'src/cli.mjs',
            'runtime/runtime-manifest.json',
            'runtime/native/operator-windows-dpapi.exe',
            'runtime/native/operator-windows-uia.exe',
            'runtime/native/operator-windows-path-lease.exe',
            'runtime/app/apps/local-agent/src/remote.js'
          )) {
            if ($required -notin $files) { throw "npm tarball missing $required" }
          }
          $typescriptRuntime = @($files | Where-Object { $_ -match '^runtime/.*\.ts$' })
          if ($typescriptRuntime.Count -ne 0) {
            throw "npm tarball must not contain TypeScript runtime files: $($typescriptRuntime -join ', ')"
          }
          $tgz = Join-Path $packDir $json[0].filename
          $tgzHash = (Get-FileHash -LiteralPath $tgz -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$tgz.sha256"
          Set-Content -LiteralPath $checksumPath -Value "$tgzHash  $($json[0].filename)" -NoNewline -Encoding ascii
          npm install --prefix $smokeDir --ignore-scripts $tgz
          if ($LASTEXITCODE -ne 0) { throw 'packed npm install failed' }
          node (Join-Path $smokeDir 'node_modules/mecord-connect/bin/operator.mjs') doctor
          if ($LASTEXITCODE -ne 0) { throw 'installed runtime entrypoint doctor failed' }
          $shim = Join-Path $smokeDir 'node_modules/.bin/mecord-connect.cmd'
          if (-not (Test-Path -LiteralPath $shim -PathType Leaf)) { throw 'npm install did not create mecord-connect.cmd bin shim' }
          & $shim doctor
          if ($LASTEXITCODE -ne 0) { throw 'installed npm bin shim doctor failed' }
          $env:OPERATOR_AGENT_TOKEN = ''
          $env:OPERATOR_RECOVERY_TOKEN = ''
          $installedRemote = Join-Path $smokeDir 'node_modules/mecord-connect/runtime/app/apps/local-agent/src/remote.js'
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $remoteGuard = @(& node $installedRemote 2>&1)
            $remoteGuardCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if ($remoteGuardCode -eq 0 -or ($remoteGuard -join "`n") -notmatch 'requires an ephemeral local agent token') {
            throw "installed runtime did not execute from node_modules to the secure launcher guard: $($remoteGuard -join ' | ')"
          }
          $global:LASTEXITCODE = 0
          "package_version=$($json[0].version)" >> $env:GITHUB_OUTPUT
          "package_filename=$($json[0].filename)" >> $env:GITHUB_OUTPUT
          "package_path=$tgz" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
          "package_sha256=$tgzHash" >> $env:GITHUB_OUTPUT

      - name: Refuse duplicate npm version
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.pack.outputs.package_version }}
        run: |
          npm view "mecord-connect@$env:PACKAGE_VERSION" version *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "mecord-connect@$env:PACKAGE_VERSION is already published; refusing overwrite"
          }
          exit 0

      - name: Revalidate exact source binding before release handoff
        env:
          OPERATOR_SOURCE_COMMIT: ${{ github.sha }}
        run: node packages/mecord-connect/src/publish-check.mjs

      - name: Upload immutable npm release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mecord-connect-${{ steps.pack.outputs.package_version }}-${{ github.sha }}
          path: |
            ${{ steps.pack.outputs.package_path }}
            ${{ steps.pack.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: First-release artifact handoff
        if: github.event_name == 'workflow_dispatch' && inputs.publication_mode == 'artifact'
        shell: pwsh
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          PACKAGE_VERSION: ${{ steps.pack.outputs.package_version }}
          PACKAGE_FILENAME: ${{ steps.pack.outputs.package_filename }}
          PACKAGE_SHA256: ${{ steps.pack.outputs.package_sha256 }}
        run: |
          "## npm first-release artifact" >> $env:GITHUB_STEP_SUMMARY
          "Version: ``$env:PACKAGE_VERSION``" >> $env:GITHUB_STEP_SUMMARY
          "Tag: ``$env:NPM_TAG``" >> $env:GITHUB_STEP_SUMMARY
          "Artifact file: ``$env:PACKAGE_FILENAME``" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: ``$env:PACKAGE_SHA256``" >> $env:GITHUB_STEP_SUMMARY
          "No registry mutation occurred. After licensing/policy gates pass, publish this exact artifact interactively with npm 2FA." >> $env:GITHUB_STEP_SUMMARY

      - name: Install npm stage-capable CLI
        if: github.event_name == 'push' || inputs.publication_mode == 'stage'
        shell: pwsh
        run: |
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm 11.19.1 install failed' }
          if ((npm --version).Trim() -ne '11.19.1') { throw 'unexpected npm CLI version' }

      - name: Require existing package before staged release
        if: github.event_name == 'push' || inputs.publication_mode == 'stage'
        shell: pwsh
        run: |
          npm view mecord-connect name --json *> $null
          if ($LASTEXITCODE -ne 0) { throw 'npm stage requires mecord-connect to already exist; use artifact mode for the first release' }

      - name: Stage npm runtime with provenance
        if: github.event_name == 'push' || inputs.publication_mode == 'stage'
        shell: pwsh
        env:
          NPM_TAG: ${{ github.event_name == 'push' && 'latest' || inputs.npm_tag }}
          PACKAGE_PATH: ${{ steps.pack.outputs.package_path }}
          PACKAGE_SHA256: ${{ steps.pack.outputs.package_sha256 }}
          OPERATOR_SOURCE_COMMIT: ${{ github.sha }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'false'
        run: |
          $actual = (Get-FileHash -LiteralPath $env:PACKAGE_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PACKAGE_SHA256) { throw 'release tarball hash changed before staging' }
          npm stage publish "$env:PACKAGE_PATH" --access public --tag "$env:NPM_TAG" --provenance --ignore-scripts=false
          if ($LASTEXITCODE -ne 0) { throw 'npm stage publish failed' }
          "Package staged successfully. Approve the exact staged version with human 2FA from npmjs.com or npm stage approve." >> $env:GITHUB_STEP_SUMMARY


  stage-rc1:
    name: Stage source-matched signed 2.0.6-rc.1 (next only)
    if: github.ref == 'refs/heads/release/npm-206-rc1-preparation-20261012' && github.repository == 'sampathkumar-co/Operator-runtime' && ((github.event_name == 'workflow_dispatch' && inputs.npm_tag == 'next' && inputs.publication_mode == 'stage') || (github.event_name == 'push' && github.actor == 'sampathkumar-co'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pull-requests: read
      attestations: read
      id-token: write
    env:
      RC_REPO: sampathkumar-co/Operator-runtime
      RC_VERSION: 2.0.6-rc.1
      NPM_TAG: next
      OPERATOR_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Validate one-time checked-in owner-authorized RC1 activation
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$RC_REPO/contents/.release/npm-rc1-activation.json?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/rc-activation.json"
          gh api "/repos/$RC_REPO/commits/$GITHUB_SHA" > "$RUNNER_TEMP/rc-activation-commit.json"
          python3 -I - <<'PY'
          import json, os, pathlib
          actual = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'rc-activation.json').read_text())
          expected = {
              'schemaVersion': 1, 'package': 'mecord-connect', 'version': '2.0.6-rc.1',
              'targetTag': 'next', 'publicationMode': 'stage', 'enabled': True,
              'ownerInstruction': 'Stage signed RC1 via GitHub with laptop offline; no stable promotion',
              'activationAttempt': 2,
          }
          assert actual == expected, 'activation content not exactly authorized'
          commit = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'rc-activation-commit.json').read_text())
          assert commit['sha'] == os.environ['GITHUB_SHA'], 'activation commit identity mismatch'
          assert any(f['filename'] == '.release/npm-rc1-activation.json' and f['status'] in ('added', 'modified') for f in commit['files']), 'activation was not committed in this push'
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['repository']['full_name'] == os.environ['RC_REPO'], 'unexpected repository'
          print('one-time RC1 stage-only activation verified')
          PY

      - name: Wait for all six original PR workflow families and exact-SHA push signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 52); do
            gh api "/repos/$RC_REPO/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > "$RUNNER_TEMP/rc-ci-wait.json"
            if python3 -I - <<'PY'
          import json, os, pathlib, sys
          runs = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'rc-ci-wait.json').read_text())['workflow_runs']
          commit = os.environ['GITHUB_SHA']
          original = {
              'CI': '.github/workflows/ci.yml',
              'Platform Matrix': '.github/workflows/platform-matrix.yml',
              'Windows Signing Smoke': '.github/workflows/windows-signing-smoke.yml',
              'NPM Remote Runtime CI': '.github/workflows/npm-remote-ci.yml',
              'R1 Canonical Runtime': '.github/workflows/r1-canonical-runtime.yml',
              'R2 Adaptive Planning Runtime': '.github/workflows/r2-adaptive-planning.yml',
          }
          missing = []
          for name, path in original.items():
              matching = [r for r in runs if r['name'] == name and r['path'] == path
                          and r['head_sha'] == commit and r['event'] == 'pull_request'
                          and any(p['number'] == 316 for p in r.get('pull_requests', []))]
              if not any(r['status'] == 'completed' and r['conclusion'] == 'success' for r in matching):
                  missing.append(name)
          signed = [r for r in runs if r['name'] == 'NPM Remote Runtime CI'
              and r['path'] == '.github/workflows/npm-remote-ci.yml'
              and r['event'] == 'push' and r['head_sha'] == commit
              and r['head_branch'] == 'release/npm-206-rc1-preparation-20261012'
              and r['status'] == 'completed' and r['conclusion'] == 'success']
          if not signed: missing.append('exact-source signed push build')
          print('Pending CI:' + ', '.join(missing) if missing else 'All six exact-PR CI families and signed builder passed')
          sys.exit(1 if missing else 0)
          PY
            then
              echo 'Fully green exact-SHA certification reached'
              break
            fi
            if [ "$attempt" -eq 52 ]; then
              echo 'CI gate timed out: stage blocked'
              exit 1
            fi
            sleep 30
          done

      - name: Validate approved exact-source RC and all CI evidence
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$RC_REPO/pulls/316" > "$RUNNER_TEMP/source-pr.json"
          gh api "/repos/$RC_REPO/actions/runs?head_sha=$OPERATOR_SOURCE_COMMIT&per_page=100" > "$RUNNER_TEMP/source-runs.json"
          python3 -I - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          read = lambda name: json.loads((root / name).read_text())
          pr, runs = (read(x) for x in ('source-pr.json','source-runs.json'))
          commit, repo = os.environ['OPERATOR_SOURCE_COMMIT'], os.environ['RC_REPO']
          assert len(commit) == 40 and all(c in '0123456789abcdef' for c in commit), 'source SHA malformed'
          assert pr['number'] == 316 and pr['head']['sha'] == commit, 'source PR is not at this workflow commit'
          assert pr['base']['ref'] == 'integration/p0-hardening-20261011', 'source PR base mismatch'
          assert pr['head']['repo']['full_name'] == repo and pr['state'] == 'open', 'source PR must remain reviewable'
          required = {
              'CI': '.github/workflows/ci.yml',
              'Platform Matrix': '.github/workflows/platform-matrix.yml',
              'Windows Signing Smoke': '.github/workflows/windows-signing-smoke.yml',
              'NPM Remote Runtime CI': '.github/workflows/npm-remote-ci.yml',
              'R1 Canonical Runtime': '.github/workflows/r1-canonical-runtime.yml',
              'R2 Adaptive Planning Runtime': '.github/workflows/r2-adaptive-planning.yml',
          }
          all_runs = runs['workflow_runs']
          for name, path in required.items():
              matched = [r for r in all_runs if r['name'] == name
                  and r['path'] == path and r['event'] == 'pull_request'
                  and r['head_sha'] == commit and r['status'] == 'completed'
                  and r['conclusion'] == 'success'
                  and any(p['number'] == 316 for p in r.get('pull_requests', []))]
              assert matched, 'missing exact PR successful run: ' + name + ' ' + path
          signed_runs = [r for r in all_runs
              if r['name'] == 'NPM Remote Runtime CI'
              and r['path'] == '.github/workflows/npm-remote-ci.yml'
              and r['event'] == 'push'
              and r['head_sha'] == commit
              and r['head_branch'] == 'release/npm-206-rc1-preparation-20261012'
              and r['status'] == 'completed' and r['conclusion'] == 'success']
          assert signed_runs, 'missing signed exact-source push build'
          builder = max(signed_runs, key=lambda r: int(r['id']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('builder_run_id=' + str(builder['id']) + '\n')
          print('OWNER-DISPATCH RC1, six path+PR bound checks green, builder run:', builder['id'])
          PY

      - name: Download candidate signed by same-source push CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mecord-connect-2.0.6-rc.1-${{ github.sha }}
          repository: sampathkumar-co/Operator-runtime
          run-id: ${{ steps.evidence.outputs.builder_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate

      - name: Check exact archived source, metadata and each runtime digest
        shell: bash
        env:
          RC_DIR: ${{ runner.temp }}/candidate
          EXPECTED_RUN: ${{ steps.evidence.outputs.builder_run_id }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RC_DIR']).resolve(strict=True)
          sha, version = os.environ['OPERATOR_SOURCE_COMMIT'], os.environ['RC_VERSION']
          filename = 'mecord-connect-' + version + '.tgz'
          assert {p.name for p in root.iterdir()} == {filename, filename + '.sha256', 'artifact-inventory.json'}, 'unexpected files in candidate'
          archive_file = root / filename
          digest = hashlib.sha256(archive_file.read_bytes()).hexdigest()
          inv = json.loads((root / 'artifact-inventory.json').read_text(encoding='utf-8-sig'))
          assert inv['source']['repository'] == os.environ['RC_REPO']
          assert inv['source']['commit'] == sha and str(inv['source']['runId']) == os.environ['EXPECTED_RUN']
          assert inv['package']['name'] == 'mecord-connect' and inv['package']['version'] == version
          assert inv['package']['sha256'] == digest and inv['package']['filename'] == filename
          assert (root / (filename + '.sha256')).read_text().strip() == digest + '  ' + filename
          with tarfile.open(archive_file, 'r:gz') as tar:
              members = tar.getmembers()
              assert all(m.isfile() or m.isdir() for m in members), 'non-regular entry'
              assert all(m.name == 'package' or m.name.startswith('package/') for m in members), 'unexpected archive root'
              names = [m.name for m in members]
              assert len(names) == len(set(n.casefold() for n in names)), 'duplicate archive path'
              pkg = json.load(tar.extractfile('package/package.json'))
              manifest_bytes = tar.extractfile('package/runtime/runtime-manifest.json').read()
              manifest = json.loads(manifest_bytes)
              assert pkg['name'] == 'mecord-connect' and pkg['version'] == version
              assert pkg['license'] == 'SEE LICENSE IN LICENSE'
              assert pkg['contentPolicy'] == {'class': 'dual-use'}
              assert pkg['repository']['url'] == 'git+https://github.com/' + os.environ['RC_REPO'] + '.git'
              assert pkg['bin'] == {'mecord-connect': 'bin/operator.mjs'}
              assert manifest['package'] == 'mecord-connect' and manifest['version'] == version
              assert manifest['platform'] == 'win32' and manifest['arch'] == 'x64'
              assert manifest['sourceCommit'] == sha
              assert hashlib.sha256(manifest_bytes).hexdigest() == inv['runtimeManifest']['sha256']
              for entry in manifest['files']:
                  payload = tar.extractfile('package/runtime/' + entry['path']).read()
                  assert len(payload) == entry['sizeBytes'] and hashlib.sha256(payload).hexdigest() == entry['sha256']
          print('candidate content, identity, runtime integrity and source: PASS SHA-256=' + digest)
          PY

      - name: Cryptographically verify independent GitHub builder attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          gh attestation verify "$RC_DIR/mecord-connect-$RC_VERSION.tgz" \
            --repo "$RC_REPO" \
            --signer-workflow "$RC_REPO/.github/workflows/npm-remote-ci.yml" \
            --source-digest "$OPERATOR_SOURCE_COMMIT" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm latest still 2.0.5 and prerelease version unused
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = 11.21.0
          python3 -I - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://registry.npmjs.org/mecord-connect', timeout=15) as response:
              p = json.load(response)
          assert p['name'] == 'mecord-connect' and p['dist-tags']['latest'] == '2.0.5'
          assert '2.0.6-rc.1' not in p['versions'], 'RC1 already public'
          assert p['dist-tags'].get('next') is None, 'npm next has another version'
          print('registry verified: latest=2.0.5, next unassigned, prerelease absent')
          PY

      - name: Stage verified RC through npm Trusted Publisher OIDC (not public until owner 2FA)
        shell: bash
        env:
          RC_DIR: ${{ runner.temp }}/candidate
