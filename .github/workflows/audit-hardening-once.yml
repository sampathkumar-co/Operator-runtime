name: Apply audit hardening once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: apply audit hardening once' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fix operation timers and exact SemVer precedence
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          relay = Path('src/core/relay-client.ts')
          s = relay.read_text()
          old = "    timer.unref();\n    const cleanup = () => {"
          if s.count(old) != 1:
              raise SystemExit(f'relay completion timer anchor mismatch: {s.count(old)}')
          relay.write_text(s.replace(old, "    const cleanup = () => {", 1))

          cdp = Path('src/capabilities/browser-cdp-connection.ts')
          s = cdp.read_text()
          old = "      timeout.unref();\n      this.#socket.addEventListener('open', () => finish(resolve), { once: true });"
          if s.count(old) != 1:
              raise SystemExit(f'CDP completion timer anchor mismatch: {s.count(old)}')
          cdp.write_text(s.replace(old, "      this.#socket.addEventListener('open', () => finish(resolve), { once: true });", 1))

          release = Path('src/core/release-update.ts')
          s = release.read_text()
          old_valid = r'''function validVersion(value: string): string {
  const text = String(value ?? '');
  if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.test(text) || text.length > 128) throw new OperatorError('UPDATE_VERSION_INVALID', 'Release version must be a bounded semantic version.');
  return text;
}'''
          new_valid = r'''function validVersion(value: string): string {
  const text = String(value ?? '');
  if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.test(text) || text.length > 128) throw new OperatorError('UPDATE_VERSION_INVALID', 'Release version must be a bounded semantic version.');
  const prerelease = text.split('-', 2)[1];
  if (prerelease) {
    for (const identifier of prerelease.split('.')) {
      if (/^\d+$/.test(identifier) && identifier.length > 1 && identifier.startsWith('0')) {
        throw new OperatorError('UPDATE_VERSION_INVALID', 'Numeric prerelease identifiers must not contain leading zeroes.');
      }
    }
  }
  return text;
}'''
          if s.count(old_valid) != 1:
              raise SystemExit(f'validVersion anchor mismatch: {s.count(old_valid)}')
          s = s.replace(old_valid, new_valid, 1)
          old_numeric = "    if (leftNumeric && rightNumeric) return Number(left) > Number(right) ? 1 : -1;"
          new_numeric = "    if (leftNumeric && rightNumeric) return BigInt(left) > BigInt(right) ? 1 : -1;"
          if s.count(old_numeric) != 1:
              raise SystemExit(f'prerelease numeric anchor mismatch: {s.count(old_numeric)}')
          s = s.replace(old_numeric, new_numeric, 1)
          old_parse = "function parseVersion(value: string): { nums: number[]; pre: string[] } {\n  const [core, prerelease] = value.split('-', 2);\n  return { nums: core.split('.').map(Number), pre: prerelease ? prerelease.split('.') : [] };\n}"
          new_parse = "function parseVersion(value: string): { nums: bigint[]; pre: string[] } {\n  const [core, prerelease] = value.split('-', 2);\n  return { nums: core.split('.').map((part) => BigInt(part)), pre: prerelease ? prerelease.split('.') : [] };\n}"
          if s.count(old_parse) != 1:
              raise SystemExit(f'parseVersion anchor mismatch: {s.count(old_parse)}')
          release.write_text(s.replace(old_parse, new_parse, 1))
          PY
          rm -f .github/workflows/audit-hardening-once.yml
          git config user.name 'Operator CI'
          git config user.email 'operator-ci@example.invalid'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close audit timer and SemVer defects'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
