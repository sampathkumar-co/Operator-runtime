name: C05 One-use Proposal Review Proof

on:
  pull_request:
    paths:
      - 'src/core/task-proposal-review.ts'
      - 'test/task-proposal-review.test.ts'
      - '.github/workflows/c05-task-review.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/task-proposal-review.ts'
      - 'test/task-proposal-review.test.ts'
      - '.github/workflows/c05-task-review.yml'

permissions:
  contents: read

jobs:
  no-model-execution-or-approval:
    name: Review receipt and reentrancy regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: node --experimental-strip-types --test test/task-proposal-review.test.ts
