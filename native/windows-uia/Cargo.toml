[package]
name = "operator-windows-uia"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"
description = "Native Windows UI Automation sidecar for Operator"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uiautomation = { version = "0.25.1", default-features = false, features = ["control", "event"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
