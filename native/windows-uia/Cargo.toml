[package]
name = "operator-windows-uia"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"
description = "Native Windows UI Automation sidecar for Operator"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# uiautomation 0.25.1 currently imports MouseButton from its input module while
# compiling core/control. Keep input enabled for upstream build compatibility;
# Operator's sidecar protocol exposes no keyboard or mouse operations.
uiautomation = { version = "0.25.1", default-features = false, features = ["input", "control", "event"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
